let filamentoAberto = { materiais:true, taras:true, estoque:true }; // estado aberto/fechado dos painéis sanfona
let filamentoEstoqueBusca = '';
let filamentoEstoqueFiltroMaterial = 'todos';
let filamentoEstoqueOrdem = 'data-desc';

function renderFilamentos(){
  const totalLiquido = DB.filamentoEstoque.reduce((s,r)=> s + filamentoPesoLiquido(r), 0);
  const limiteFilamentos = DB.config.limiteBaixoFilamentos ?? 200;

  let listaEstoque = [...DB.filamentoEstoque];
  if(filamentoEstoqueBusca) listaEstoque = listaEstoque.filter(r=> (r.marca+' '+r.material+' '+filamentoCoresLista(r).map(c=>c.nome).join(' ')).toLowerCase().includes(filamentoEstoqueBusca.toLowerCase()));
  if(filamentoEstoqueFiltroMaterial!=='todos') listaEstoque = listaEstoque.filter(r=> r.material===filamentoEstoqueFiltroMaterial);
  const [campoOrdFil, dirOrdFil] = filamentoEstoqueOrdem.split('-');
  if(campoOrdFil==='liquido') listaEstoque = ordenarLista(listaEstoque.map(r=>({...r, __liquido: filamentoPesoLiquido(r)})), '__liquido', dirOrdFil);
  else if(campoOrdFil==='data') listaEstoque = ordenarLista(listaEstoque, 'dataRegistro', dirOrdFil);
  else listaEstoque = ordenarLista(listaEstoque, campoOrdFil, dirOrdFil);
  const materiaisPresentesEstoque = [...new Set(DB.filamentoEstoque.map(r=>r.material).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  pageEl.innerHTML = `
    <div class="page-head">
      <div><h1>Filamentos</h1><p>Controle o peso líquido do seu estoque de filamento.</p></div>
      <button class="btn" id="btnCadastroFilamento">${ICON_PLUS}Cadastro de filamento</button>
    </div>

    <div class="panel" style="padding:14px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
      <label style="margin:0; font-weight:600; font-size:13.5px; color:var(--text);">Limite para Estoque Baixo (peso líquido total, em g):</label>
      <input type="number" id="inputLimiteFilamentos" value="${limiteFilamentos}" min="0" style="width:100px;">
      <button class="btn sm secondary" id="btnSalvarLimiteFilamentos">Definir limite</button>
    </div>

    <details class="panel" id="panelMateriaisFilamento" ${filamentoAberto.materiais?'open':''}>
      <summary>Tipos de Material <span class="count">${DB.materiais.length} tipo(s)</span><span class="chev">${ICON_CHEVRON}</span></summary>
      <p class="hint" style="margin:0 0 12px 0;">Esta lista é a mesma usada no campo Material dos Produtos — cadastre aqui os tipos que você imprime (PLA, PETG, ABS…).</p>
      <div class="field-row">
        <div class="field" style="flex:1;"><input type="text" id="inputNovoMaterialFilamento" placeholder="Novo tipo de material (ex.: PLA, PETG, ABS…)"></div>
        <div style="display:flex; align-items:flex-start;"><button type="button" class="btn secondary" id="btnAddMaterialFilamento">${ICON_PLUS}Adicionar</button></div>
      </div>
      ${DB.materiais.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Material</th><th class="num">Em uso</th><th></th></tr></thead>
        <tbody>
          ${DB.materiais.map((m,i)=>{
            const emUso = DB.filamentoEstoque.filter(r=>r.material===m).length + DB.produtos.filter(p=>p.material===m).length;
            return `<tr>
              <td><input type="text" class="mono" data-editar-material-fil="${i}" value="${esc(m)}" style="background:transparent; border:1px solid var(--border); border-radius:6px; padding:6px 8px; color:var(--text); font-weight:600; width:100%; max-width:220px;"></td>
              <td class="num mono">${emUso}</td>
              <td><div class="row-actions">
                <button class="icon-btn" data-del-material-fil="${i}" title="Excluir material">${ICON_TRASH}</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>` : '<p class="hint">Nenhum tipo de material cadastrado ainda.</p>'}
    </details>

    <details class="panel" id="panelTaraMarca" ${filamentoAberto.taras?'open':''}>
      <summary>Tara por Marca <span class="count">${DB.filamentoTaras.length} marca(s)</span><span class="chev">${ICON_CHEVRON}</span></summary>
      <p class="hint" style="margin:0 0 12px 0;">Abasteça aqui os pesos de carretéis vazios — o app identifica a marca e calcula a tara média automaticamente, sem precisar repetir amostras para cada material.</p>
      <div class="field-row">
        <div class="field"><input type="text" id="inputTaraMarca" placeholder="Marca (ex.: Voolt3D)" list="listaMarcasTara"></div>
        <div class="field"><input type="number" id="inputTaraPeso" min="0" step="1" placeholder="Peso do carretel vazio (g)"></div>
        <div style="display:flex; align-items:flex-start;"><button type="button" class="btn secondary" id="btnAddTaraMarca">${ICON_PLUS}Adicionar</button></div>
      </div>
      <datalist id="listaMarcasTara">${DB.filamentoTaras.map(t=>`<option value="${esc(t.marca)}">`).join('')}</datalist>
      ${DB.filamentoTaras.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Marca</th><th class="num">Tara média</th><th class="num">Amostras</th><th></th></tr></thead>
        <tbody>
          ${DB.filamentoTaras.map((t,i)=>`
            <tr>
              <td><input type="text" class="mono" data-editar-marca="${i}" value="${esc(t.marca)}" style="background:transparent; border:1px solid var(--border); border-radius:6px; padding:6px 8px; color:var(--text); font-weight:600; width:100%; max-width:220px;"></td>
              <td class="num mono">${t.amostras.length? filamentoTaraMediaMarca(t.marca).toFixed(1)+' g' : '—'}</td>
              <td class="num mono">${t.amostras.length} amostra(s)</td>
              <td><div class="row-actions">
                <button class="btn sm secondary" data-gerenciar-tara="${esc(t.marca)}">Ver amostras</button>
                <button class="icon-btn" data-del-marca="${i}" title="Excluir marca">${ICON_TRASH}</button>
              </div></td>
            </tr>`).join('')}
        </tbody>
      </table></div>` : '<p class="hint">Nenhuma marca com tara cadastrada ainda.</p>'}
    </details>

    <details class="panel" id="panelEstoqueFilamento" ${filamentoAberto.estoque?'open':''}>
      <summary>Estoque Atual <span class="count">${DB.filamentoEstoque.length} registro(s) — total líquido: ${totalLiquido.toFixed(0)} g</span><span class="chev">${ICON_CHEVRON}</span></summary>
      ${DB.filamentoEstoque.length ? `<div class="toolbar" style="margin-bottom:14px;">
        <div class="search-box">${ICON_SEARCH}<input id="buscaFilamentoEstoque" placeholder="Buscar por marca, material ou cor…" value="${esc(filamentoEstoqueBusca)}"></div>
        <select id="filtroMaterialEstoqueFil" style="max-width:200px;">
          <option value="todos">Todos os materiais</option>
          ${materiaisPresentesEstoque.map(m=>`<option value="${esc(m)}" ${filamentoEstoqueFiltroMaterial===m?'selected':''}>${esc(m)}</option>`).join('')}
        </select>
        <select id="selectOrdemFilamentoEstoque" style="max-width:220px; margin-left:auto;">
          <option value="data-desc" ${filamentoEstoqueOrdem==='data-desc'?'selected':''}>Mais recente</option>
          <option value="data-asc" ${filamentoEstoqueOrdem==='data-asc'?'selected':''}>Mais antigo</option>
          <option value="marca-asc" ${filamentoEstoqueOrdem==='marca-asc'?'selected':''}>Marca (A-Z)</option>
          <option value="marca-desc" ${filamentoEstoqueOrdem==='marca-desc'?'selected':''}>Marca (Z-A)</option>
          <option value="liquido-desc" ${filamentoEstoqueOrdem==='liquido-desc'?'selected':''}>Peso líquido (maior-menor)</option>
          <option value="liquido-asc" ${filamentoEstoqueOrdem==='liquido-asc'?'selected':''}>Peso líquido (menor-maior)</option>
        </select>
      </div>` : ''}
      ${listaEstoque.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Marca</th><th>Material</th><th>Cor(es)</th><th class="num">Preço</th><th class="num">Peso bruto</th><th class="num">Tara</th><th class="num">Peso líquido</th><th></th></tr></thead>
        <tbody>
          ${listaEstoque.map(r=>{
            const tara = filamentoTaraMediaMarca(r.marca);
            const liquido = filamentoPesoLiquido(r);
            return `<tr style="cursor:pointer;" data-row-rolo="${r.id}">
              <td><b>${esc(r.marca)}</b></td>
              <td>${esc(r.material)}</td>
              <td>${filamentoCoresChipsHTML(r)}</td>
              <td class="num mono">${r.preco? fmtMoney(r.preco) : '—'}</td>
              <td class="num mono">${Number(r.pesoBruto||0).toFixed(0)} g</td>
              <td class="num mono">${tara.toFixed(1)} g</td>
              <td class="num mono" style="font-weight:600; color:var(--accent);">${liquido.toFixed(0)} g</td>
              <td><div class="row-actions">
                <button class="icon-btn" data-del-rolo="${r.id}">${ICON_TRASH}</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>` : (DB.filamentoEstoque.length ? '<p class="hint" style="padding:16px 0 4px;">Nenhum filamento encontrado para este filtro.</p>' : emptyState('Nenhum filamento cadastrado ainda.', 'btnCadastroFilamentoEmpty'))}
    </details>
  `;

  document.getElementById('btnCadastroFilamento').addEventListener('click', ()=> openFilamentoCadastroForm());
  document.getElementById('btnCadastroFilamentoEmpty')?.addEventListener('click', ()=> openFilamentoCadastroForm());
  document.getElementById('btnSalvarLimiteFilamentos').addEventListener('click', ()=>{
    const val = parseInt(document.getElementById('inputLimiteFilamentos').value, 10);
    DB.config.limiteBaixoFilamentos = isNaN(val) ? 200 : Math.max(0, val);
    save(); renderFilamentos();
  });

  // painéis sanfona: lembram se estão abertos/fechados entre re-renderizações
  document.getElementById('panelMateriaisFilamento').addEventListener('toggle', e=>{ filamentoAberto.materiais = e.target.open; });
  document.getElementById('panelTaraMarca').addEventListener('toggle', e=>{ filamentoAberto.taras = e.target.open; });
  document.getElementById('panelEstoqueFilamento').addEventListener('toggle', e=>{ filamentoAberto.estoque = e.target.open; });

  // ---- Tipos de Material ----
  document.getElementById('btnAddMaterialFilamento').addEventListener('click', ()=>{
    const val = document.getElementById('inputNovoMaterialFilamento').value.trim();
    if(!val){ alert('Digite o nome do material.'); return; }
    if(DB.materiais.includes(val)){ alert('Esse material já existe.'); return; }
    DB.materiais.push(val);
    save(); renderFilamentos();
  });
  pageEl.querySelectorAll('[data-editar-material-fil]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = Number(inp.dataset.editarMaterialFil);
      const antigo = DB.materiais[i];
      const novo = inp.value.trim();
      if(!novo){ inp.value = antigo; return; }
      if(novo!==antigo && DB.materiais.includes(novo)){ alert('Já existe um material com esse nome.'); inp.value = antigo; return; }
      DB.materiais[i] = novo;
      DB.produtos.forEach(p=>{ if(p.material===antigo) p.material = novo; });
      DB.filamentoEstoque.forEach(r=>{ if(r.material===antigo) r.material = novo; });
      save(); renderFilamentos();
    });
  });
  pageEl.querySelectorAll('[data-del-material-fil]').forEach(b=> b.addEventListener('click', ()=>{
    const i = Number(b.dataset.delMaterialFil);
    const nome = DB.materiais[i];
    const emUso = DB.filamentoEstoque.filter(r=>r.material===nome).length + DB.produtos.filter(p=>p.material===nome).length;
    if(emUso && !confirm(`${emUso} registro(s) (produtos e/ou filamentos) usam esse material. Excluir mesmo assim?`)) return;
    if(!emUso && !confirm(`Excluir o material "${nome}"?`)) return;
    DB.materiais.splice(i,1);
    save(); renderFilamentos();
  }));

  // ---- Tara por Marca ----
  document.getElementById('btnAddTaraMarca').addEventListener('click', ()=>{
    const marca = document.getElementById('inputTaraMarca').value.trim();
    const peso = parseFloat(document.getElementById('inputTaraPeso').value);
    if(!marca){ alert('Informe a marca.'); return; }
    if(!peso || peso<=0){ alert('Informe um peso válido.'); return; }
    let rec = filamentoTaraByMarca(marca);
    if(!rec){ rec = {marca, amostras:[]}; DB.filamentoTaras.push(rec); }
    rec.amostras.push(peso);
    save(); renderFilamentos();
  });
  pageEl.querySelectorAll('[data-gerenciar-tara]').forEach(b=> b.addEventListener('click', ()=> openFilamentoTaraManager(b.dataset.gerenciarTara)));
  pageEl.querySelectorAll('[data-editar-marca]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = Number(inp.dataset.editarMarca);
      const rec = DB.filamentoTaras[i];
      const antigo = rec.marca;
      const novo = inp.value.trim();
      if(!novo){ inp.value = antigo; return; }
      if(normalizarMarca(novo) !== normalizarMarca(antigo)){
        const existente = DB.filamentoTaras.find((t,idx)=> idx!==i && normalizarMarca(t.marca)===normalizarMarca(novo));
        if(existente){
          existente.amostras = [...existente.amostras, ...rec.amostras];
          DB.filamentoTaras.splice(i,1);
        } else {
          rec.marca = novo;
        }
        DB.filamentoEstoque.forEach(r=>{ if(normalizarMarca(r.marca)===normalizarMarca(antigo)) r.marca = novo; });
      }
      save(); renderFilamentos();
    });
  });
  pageEl.querySelectorAll('[data-del-marca]').forEach(b=> b.addEventListener('click', ()=>{
    const i = Number(b.dataset.delMarca);
    const marca = DB.filamentoTaras[i]?.marca;
    if(!marca) return;
    const emUso = DB.filamentoEstoque.filter(r=> normalizarMarca(r.marca)===normalizarMarca(marca)).length;
    if(emUso && !confirm(`${emUso} registro(s) de estoque usam a marca "${marca}". Se excluir, a tara dessa marca some e o peso líquido desses registros passa a considerar tara zero. Excluir mesmo assim?`)) return;
    if(!emUso && !confirm(`Excluir a marca "${marca}"?`)) return;
    DB.filamentoTaras.splice(i,1);
    save(); renderFilamentos();
  }));

  // ---- Estoque Atual ----
  document.getElementById('buscaFilamentoEstoque')?.addEventListener('input', e=>{
    filamentoEstoqueBusca = e.target.value; renderFilamentos();
    const el=document.getElementById('buscaFilamentoEstoque'); if(el){ el.focus(); el.selectionStart = el.value.length; }
  });
  document.getElementById('filtroMaterialEstoqueFil')?.addEventListener('change', e=>{
    filamentoEstoqueFiltroMaterial = e.target.value; renderFilamentos();
  });
  document.getElementById('selectOrdemFilamentoEstoque')?.addEventListener('change', e=>{
    filamentoEstoqueOrdem = e.target.value; renderFilamentos();
  });
  pageEl.querySelectorAll('[data-row-rolo]').forEach(tr=> tr.addEventListener('click', e=>{
    if(e.target.closest('.row-actions')) return;
    openFilamentoCadastroForm(tr.dataset.rowRolo);
  }));
  pageEl.querySelectorAll('[data-del-rolo]').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    if(!confirm('Excluir este registro de estoque?')) return;
    DB.filamentoEstoque = DB.filamentoEstoque.filter(r=>r.id!==b.dataset.delRolo);
    save(); renderFilamentos();
  }));
}

// Ver/gerenciar amostras de tara de uma marca específica
function openFilamentoTaraManager(marca){
  function draw(){
    const rec = filamentoTaraByMarca(marca);
    const amostras = rec ? rec.amostras : [];
    const media = filamentoTaraMediaMarca(marca);
    openModal(`
      <div class="modal-head"><h3>Tara — ${esc(marca)}</h3>
        <button class="modal-close" id="mClose">${ICON_CLOSE}</button></div>
      <div class="field-row">
        <div class="field" style="flex:1;"><input type="number" id="inputAmostra" min="0" step="1" placeholder="Peso do carretel vazio (g)"></div>
        <div style="display:flex; align-items:flex-start;"><button type="button" class="btn secondary" id="btnAddAmostra">${ICON_PLUS}Adicionar</button></div>
      </div>
      ${amostras.length ? amostras.map((v,i)=>`
        <div class="extra-item-row">
          <span class="mono">Amostra #${i+1}</span>
          <span class="mono num">${Number(v).toFixed(0)} g</span>
          <button type="button" class="icon-btn" data-del-amostra="${i}">${ICON_TRASH}</button>
        </div>
      `).join('') : '<p class="hint">Nenhuma amostra cadastrada ainda.</p>'}
      <div class="totals-box">
        <div class="row final"><span>Tara média (${amostras.length} amostra(s))</span><b>${amostras.length? media.toFixed(1)+' g' : '—'}</b></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnConcluirTara">Concluir</button>
      </div>
    `);
    document.getElementById('mClose').addEventListener('click', ()=>{ closeModal(); renderFilamentos(); });
    document.getElementById('btnConcluirTara').addEventListener('click', ()=>{ closeModal(); renderFilamentos(); });
    document.getElementById('btnAddAmostra').addEventListener('click', ()=>{
      const val = parseFloat(document.getElementById('inputAmostra').value);
      if(!val || val<=0){ alert('Informe um peso válido.'); return; }
      let r = filamentoTaraByMarca(marca);
      if(!r){ r = {marca, amostras:[]}; DB.filamentoTaras.push(r); }
      r.amostras.push(val);
      save(); draw();
    });
    document.querySelectorAll('[data-del-amostra]').forEach(b=> b.addEventListener('click', ()=>{
      const r = filamentoTaraByMarca(marca);
      r.amostras.splice(Number(b.dataset.delAmostra), 1);
      save(); draw();
    }));
  }
  draw();
}

// Cadastro / edição direta de um registro de estoque de filamento (marca, material, preço, peso, obs, cores)
function openFilamentoCadastroForm(id){
  const editing = id ? filamentoRoloById(id) : null;
  let coresFil = editing ? JSON.parse(JSON.stringify(filamentoCoresLista(editing))) : [{nome:'', hex:'#3fc1b0'}];

  function renderCoresFilList(){
    const area = document.getElementById('coresFilArea');
    if(!area) return;
    area.innerHTML = coresFil.map((c, idx) => `
      <div class="color-row">
        <input type="color" class="color-hex-fil" data-idx="${idx}" value="${c.hex||'#3fc1b0'}" style="width:40px; height:34px; padding:2px; cursor:pointer;">
        <input type="text" class="color-nome-fil" data-idx="${idx}" value="${esc(c.nome)}" placeholder="Nome da cor (ex: Azul, Dourado)">
        <button type="button" class="icon-btn remove-color-fil" data-idx="${idx}">${ICON_CLOSE}</button>
      </div>
    `).join('');
    area.querySelectorAll('.color-hex-fil').forEach(inp => {
      inp.addEventListener('input', e => { coresFil[e.target.dataset.idx].hex = e.target.value; });
    });
    area.querySelectorAll('.color-nome-fil').forEach(inp => {
      inp.addEventListener('input', e => {
        const idx = e.target.dataset.idx;
        coresFil[idx].nome = e.target.value;
        const hexAuto = corPorNome(e.target.value);
        if(hexAuto){
          coresFil[idx].hex = hexAuto;
          const hexInput = area.querySelector(`.color-hex-fil[data-idx="${idx}"]`);
          if(hexInput) hexInput.value = hexAuto;
        }
      });
    });
    area.querySelectorAll('.remove-color-fil').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx = Number(e.currentTarget.dataset.idx);
        coresFil.splice(idx, 1);
        renderCoresFilList();
      });
    });
  }

  function atualizarPreviewFilamento(){
    const marcaAtual = document.getElementById('cfMarca').value;
    const pesoAtual = document.getElementById('cfPesoBruto').value;
    const tara = marcaAtual ? filamentoTaraMediaMarca(marcaAtual) : 0;
    const liquido = Math.max(0, (parseFloat(pesoAtual)||0) - tara);
    document.getElementById('cfPreviewBox').innerHTML = `
      <div class="row"><span>Tara aplicada (${esc(marcaAtual)||'—'})</span><b>${tara.toFixed(1)} g</b></div>
      <div class="row final"><span>Peso líquido</span><b>${liquido.toFixed(0)} g</b></div>
    `;
    const avisoEl = document.getElementById('cfAvisoTara');
    if(avisoEl) avisoEl.style.display = (!filamentoTaraByMarca(marcaAtual) && marcaAtual) ? '' : 'none';
  }

  function draw(){
    const marcaAtual = editing?.marca ?? '';
    const pesoAtual = editing?.pesoBruto ?? '';
    const tara = marcaAtual ? filamentoTaraMediaMarca(marcaAtual) : 0;
    const liquido = Math.max(0, (parseFloat(pesoAtual)||0) - tara);

    openModal(`
      <div class="modal-head"><h3>${editing?'Editar filamento':'Cadastro de filamento'}</h3>
        <button class="modal-close" id="mClose">${ICON_CLOSE}</button></div>
      <form id="formFilamento">
        <div class="field-row">
          <div class="field"><label>Marca *</label><input id="cfMarca" name="marca" required value="${esc(marcaAtual)}" placeholder="Ex.: Voolt3D" list="listaMarcasCadastro"></div>
          <div class="field"><label>Material *</label>
            <div style="display:flex; gap:6px;">
              <select name="material" id="cfMaterialSelect" required style="flex:1;">
                <option value="">Selecione…</option>
                ${DB.materiais.map(m=>`<option value="${esc(m)}" ${editing?.material===m?'selected':''}>${esc(m)}</option>`).join('')}
              </select>
              <button type="button" class="btn ghost sm" id="btnNovoMaterialFilCad">${ICON_PLUS}</button>
            </div>
          </div>
        </div>
        <datalist id="listaMarcasCadastro">${DB.filamentoTaras.map(t=>`<option value="${esc(t.marca)}">`).join('')}</datalist>

        <div class="field"><label>Preço (R$)</label><input name="preco" type="number" step="0.01" min="0" value="${editing?.preco??''}" placeholder="Preço do rolo/kg"></div>

        <div class="field">
          <label>Cor(es) do Filamento</label>
          <div id="coresFilArea"></div>
          <button type="button" class="btn ghost sm" id="btnAddColorFil" style="margin-top:6px;">${ICON_PLUS}Adicionar cor</button>
          <p class="hint">Filamento de uma cor só? Deixe apenas uma linha. Para duo color ou multicolor, adicione duas ou mais — ao digitar o nome da cor (ex.: "Azul", "Dourado"), a cor é preenchida automaticamente.</p>
        </div>

        <div class="field-row">
          <div class="field"><label>Peso bruto — carretel + filamento (g) *</label><input id="cfPesoBruto" name="pesoBruto" type="number" min="0" step="1" required value="${editing?.pesoBruto??''}"></div>
          <div class="field"><label>Observação</label><input name="obs" type="text" value="${esc(editing?.obs||'')}"></div>
        </div>
        <div class="totals-box" id="cfPreviewBox" style="margin-bottom:8px;">
          <div class="row"><span>Tara aplicada (${esc(marcaAtual)||'—'})</span><b>${tara.toFixed(1)} g</b></div>
          <div class="row final"><span>Peso líquido</span><b>${liquido.toFixed(0)} g</b></div>
        </div>
        <p class="hint" id="cfAvisoTara" style="color:var(--warn); ${!filamentoTaraByMarca(marcaAtual) && marcaAtual ? '' : 'display:none;'}">Essa marca ainda não tem tara cadastrada — o peso líquido será calculado como 0 até você adicionar uma amostra no painel "Tara por Marca".</p>
        <div class="modal-actions">
          ${editing? `<button type="button" class="btn ghost" id="btnExcluirRolo" style="color:var(--danger);">Excluir</button>` : `<button type="button" class="btn secondary" id="mCancel">Cancelar</button>`}
          <button type="submit" class="btn">${editing?'Salvar alterações':'Cadastrar'}</button>
        </div>
      </form>
    `);
    document.getElementById('mClose').addEventListener('click', closeModal);
    document.getElementById('mCancel')?.addEventListener('click', closeModal);
    document.getElementById('btnExcluirRolo')?.addEventListener('click', ()=>{
      if(!confirm('Excluir este registro de estoque?')) return;
      DB.filamentoEstoque = DB.filamentoEstoque.filter(r=>r.id!==editing.id);
      save(); closeModal(); renderFilamentos();
    });
    document.getElementById('cfMarca').addEventListener('input', atualizarPreviewFilamento);
    document.getElementById('cfPesoBruto').addEventListener('input', atualizarPreviewFilamento);
    document.getElementById('btnNovoMaterialFilCad').addEventListener('click', ()=>{
      const novo = prompt('Nome do novo material:');
      if(!novo || !novo.trim()) return;
      if(!DB.materiais.includes(novo.trim())) DB.materiais.push(novo.trim());
      save();
      const sel = document.getElementById('cfMaterialSelect');
      sel.innerHTML = `<option value="">Selecione…</option>${DB.materiais.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}`;
      sel.value = novo.trim();
    });
    renderCoresFilList();
    document.getElementById('btnAddColorFil').addEventListener('click', ()=>{
      coresFil.push({nome:'', hex:'#3fc1b0'});
      renderCoresFilList();
    });
    document.getElementById('formFilamento').addEventListener('submit', e=>{
      e.preventDefault();
      const f = new FormData(e.target);
      const marca = f.get('marca').trim(), material = f.get('material').trim();
      if(!marca || !material){ alert('Preencha marca e material.'); return; }
      const coresFinal = coresFil.filter(c=>c.hex);
      if(!coresFinal.length) coresFinal.push({nome:'', hex:'#3fc1b0'});
      const obj = {
        marca, material,
        preco: parseFloat(f.get('preco'))||0,
        cores: coresFinal,
        corHex: coresFinal[0].hex,
        pesoBruto: parseFloat(f.get('pesoBruto'))||0,
        obs: (f.get('obs')||'').trim()
      };
      if(editing){ Object.assign(editing, obj); }
      else { obj.id = uid(); obj.dataRegistro = todayISO(); DB.filamentoEstoque.push(obj); }
      save(); closeModal(); renderFilamentos();
    });
  }
  draw();
}
let pedidoFiltroStatus = new Set(); // vazio = mostra todos os status
let pedidoBusca = '';
let pedidoOrdem = 'dataEntrega-asc';

function renderPedidos(){
  let list = [...DB.pedidos];
  if(pedidoFiltroStatus.size>0) list = list.filter(p=>pedidoFiltroStatus.has(p.status));
  if(pedidoBusca) list = list.filter(p=> clienteNome(p.clienteId).toLowerCase().includes(pedidoBusca.toLowerCase()));
  const [campoOrd, dirOrd] = pedidoOrdem.split('-');
  if(campoOrd==='cliente') list = ordenarLista(list.map(p=>({...p, __cliente:clienteNome(p.clienteId)})), '__cliente', dirOrd);
  else if(campoOrd==='total') list = ordenarLista(list.map(p=>({...p, __total:pedidoTotal(p)})), '__total', dirOrd);
  else list = ordenarLista(list, campoOrd, dirOrd);

  pageEl.innerHTML = `
    <div class="page-head">
      <div><h1>Pedidos</h1><p>Acompanhe cada demanda do orçamento até a entrega.</p></div>
      <button class="btn" id="btnNovoPedido">${ICON_PLUS}Novo pedido</button>
    </div>
    <div class="panel">
      <div class="toolbar">
        <div class="search-box">${ICON_SEARCH}<input id="buscaPedido" placeholder="Buscar por cliente…" value="${esc(pedidoBusca)}"></div>
        <div class="chip-filters">
          ${STATUS_LIST.map(s=>{
            const ativo = pedidoFiltroStatus.size===0 || pedidoFiltroStatus.has(s.id);
            return `<button type="button" class="badge ${s.cls} chip-toggle ${ativo?'chip-active':'chip-inactive'}" data-status-chip="${s.id}" title="Mostrar/ocultar ${s.label}">${s.label}</button>`;
          }).join('')}
          ${pedidoFiltroStatus.size>0 ? `<button type="button" class="chip-clear" id="btnLimparStatus">Limpar filtro ✕</button>` : ''}
        </div>
        <select id="selectOrdemPedido" style="max-width:220px; margin-left:auto;">
          <option value="dataEntrega-asc" ${pedidoOrdem==='dataEntrega-asc'?'selected':''}>Entrega (mais próxima)</option>
          <option value="dataEntrega-desc" ${pedidoOrdem==='dataEntrega-desc'?'selected':''}>Entrega (mais distante)</option>
          <option value="dataPedido-desc" ${pedidoOrdem==='dataPedido-desc'?'selected':''}>Mais recentes</option>
          <option value="dataPedido-asc" ${pedidoOrdem==='dataPedido-asc'?'selected':''}>Mais antigos</option>
          <option value="cliente-asc" ${pedidoOrdem==='cliente-asc'?'selected':''}>Cliente (A-Z)</option>
          <option value="total-desc" ${pedidoOrdem==='total-desc'?'selected':''}>Total (maior-menor)</option>
          <option value="total-asc" ${pedidoOrdem==='total-asc'?'selected':''}>Total (menor-maior)</option>
        </select>
      </div>
      ${list.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Cliente</th><th>Itens</th><th>Entrega</th><th>Pagamento</th><th>Status</th><th>Pago?</th><th class="num">Total</th><th></th></tr></thead>
        <tbody>
          ${list.map(p=>{
            const atrasado = p.dataEntrega && !['entregue','cancelado'].includes(p.status) && daysUntil(p.dataEntrega)<0;
            const itensResumo = (p.itens||[]).map(it=> produtoById(it.produtoId)?.nome || '—').join(', ') || '—';
            const cli = clienteById(p.clienteId);
            const wLink = whatsappLink(cli?.telefone);
            return `<tr data-dbl="${p.id}">
              <td>${esc(clienteNome(p.clienteId))}</td>
              <td>${esc(itensResumo)}</td>
              <td class="mono" style="${atrasado?'color:var(--danger); font-weight:600;':''}">${fmtDate(p.dataEntrega)}${atrasado?' ⚠':''}</td>
              <td class="mono">${esc(p.formaPagamento||'PIX')}</td>
              <td>${badge(p.status)}</td>
              <td>${p.pago? '<span class="badge b-pronto">Pago</span>' : '<span class="badge b-cancelado">Não pago</span>'}</td>
              <td class="num mono">${fmtMoney(pedidoTotal(p))}</td>
              <td><div class="row-actions">
                ${wLink? `<button class="icon-btn whatsapp-btn" data-whats="${p.id}" title="Falar no WhatsApp">${ICON_WHATS}</button>`:''}
                <button class="icon-btn" data-view="${p.id}" title="Editar">${ICON_EDIT}</button>
                <button class="icon-btn" data-del="${p.id}" title="Excluir">${ICON_TRASH}</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>` : emptyState('Nenhum pedido encontrado para este filtro.', 'btnNovoPedidoEmpty')}
    </div>
  `;
  document.getElementById('btnNovoPedido').addEventListener('click', ()=> openPedidoForm());
  document.getElementById('btnNovoPedidoEmpty')?.addEventListener('click', ()=> openPedidoForm());
  document.getElementById('buscaPedido').addEventListener('input', e=>{
    pedidoBusca=e.target.value; renderPedidos();
    const el=document.getElementById('buscaPedido'); el.focus(); el.selectionStart = el.value.length;
  });
  pageEl.querySelectorAll('[data-status-chip]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.statusChip;
    if(pedidoFiltroStatus.has(id)) pedidoFiltroStatus.delete(id); else pedidoFiltroStatus.add(id);
    renderPedidos();
  }));
  document.getElementById('btnLimparStatus')?.addEventListener('click', ()=>{ pedidoFiltroStatus.clear(); renderPedidos(); });
  document.getElementById('selectOrdemPedido').addEventListener('change', e=>{ pedidoOrdem=e.target.value; renderPedidos(); });
  pageEl.querySelectorAll('[data-view]').forEach(b=> b.addEventListener('click', ()=> openPedidoForm(b.dataset.view)));
  pageEl.querySelectorAll('tr[data-dbl]').forEach(tr=> tr.addEventListener('dblclick', e=>{
    if(e.target.closest('.row-actions')) return;
    openPedidoForm(tr.dataset.dbl);
  }));
  pageEl.querySelectorAll('[data-whats]').forEach(b=> b.addEventListener('click', ()=>{
    const p = DB.pedidos.find(p=>p.id===b.dataset.whats);
    const cli = clienteById(p?.clienteId);
    const link = whatsappLink(cli?.telefone);
    if(link) window.open(link, '_blank');
  }));
  pageEl.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm('Excluir este pedido?')) return;
    DB.pedidos = DB.pedidos.filter(p=>p.id!==b.dataset.del);
    save(); renderPedidos();
  }));
}

function openPedidoForm(id){
  const editing = id ? DB.pedidos.find(p=>p.id===id) : null;
  if(DB.clientes.length===0){
    alert('Cadastre pelo menos um cliente antes de criar um pedido.');
    return;
  }
  let itens = editing?.itens?.length ? editing.itens.map(it=>({...it, extras:(it.extras||[]).map(ex=>({...ex}))})) : [];

  function itemRowHTML(it, idx){
    const prod = produtoById(it.produtoId);
    const extrasChips = (it.extras||[]).map((ex,exIdx)=>{
      const item = itemExtraById(ex.itemExtraId);
      if(!item) return '';
      return `<span class="extra-chip">${produtoThumbHTML(item, 18)}${esc(item.nome)} ${Number(ex.qtd||1)>1?`×${ex.qtd}`:''} — ${fmtMoney(item.custo)}
        <button type="button" class="extra-remove" data-item-idx="${idx}" data-extra-idx="${exIdx}">${ICON_CLOSE}</button>
      </span>`;
    }).join('');
    const custoItem = itemCustoTotal(it);
    return `<div class="item-row-card" data-idx="${idx}">
      <div class="item-row">
        <div style="display:flex; align-items:center; gap:8px;">
          ${produtoThumbHTML(prod, 34)}
          <select class="it-produto" style="flex:1;">
            <option value="">Selecione um produto…</option>
            ${DB.produtos.map(p=>`<option value="${p.id}" ${it.produtoId===p.id?'selected':''}>${esc(p.nome)} — ${fmtMoney(p.preco)}</option>`).join('')}
          </select>
        </div>
        <input class="it-qtd" type="number" min="1" step="1" value="${it.qtd||1}" placeholder="Qtd">
        <input class="it-preco" type="number" min="0" step="0.01" value="${it.preco ?? (prod?prod.preco:'')}" placeholder="Preço un.">
        <button type="button" class="icon-btn it-remove">${ICON_CLOSE}</button>
      </div>
      <div class="item-extras-area">
        ${extrasChips}
        <select class="it-add-extra">
          <option value="">+ Adicionar item extra (argola, corrente, vela…)</option>
          ${DB.itensExtras.map(ex=>`<option value="${ex.id}">${esc(ex.nome)} — ${fmtMoney(ex.custo)}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap;">
        <label style="margin:0; font-weight:400; font-size:12.5px; color:var(--text-muted); white-space:nowrap;">Data de entrega deste produto:</label>
        <input class="it-data-entrega" type="date" value="${it.dataEntrega||''}" style="padding:5px 8px; max-width:165px;">
        <span class="hint" style="margin:0;">(opcional — deixe em branco para usar a entrega geral do pedido)</span>
      </div>
      <div class="item-cost-preview">Custo deste item (produto + extras × qtd): <b>${fmtMoney(custoItem)}</b>${it.dataEntrega?` · Entrega: <b>${fmtDate(it.dataEntrega)}</b>`:''}</div>
    </div>`;
  }

  function itemsAreaHTML(){
    return `${itens.map(itemRowHTML).join('')}`;
  }

  function pedidoRascunho(f){
    return {
      itens: itens.filter(it=>it.produtoId).map(it=>({produtoId:it.produtoId, qtd:Number(it.qtd)||1, preco:Number(it.preco)||0, extras:it.extras||[], dataEntrega:it.dataEntrega||''})),
      valorManual: parseFloat(f.get('valorManual'))||0,
      formaPagamento: f.get('formaPagamento'),
      custoExtra: parseFloat(f.get('custoExtra'))||0,
      taxaCartaoPercent: parseFloat(f.get('taxaCartaoPercent'))||0,
    };
  }

  openModal(`
    <div class="modal-head"><h3>${editing?'Editar pedido':'Novo pedido'}</h3>
      <button class="modal-close" id="mClose">${ICON_CLOSE}</button></div>
    <form id="formPedido">
      <div class="field-row">
        <div class="field"><label>Cliente *</label>
          <select name="clienteId" required>
            <option value="">Selecione…</option>
            ${DB.clientes.map(c=>`<option value="${c.id}" ${editing?.clienteId===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Status</label>
          <select name="status" id="statusSelect">
            ${STATUS_LIST.map(s=>`<option value="${s.id}" ${(editing?.status||'emorcamento')===s.id?'selected':''}>${s.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Data do pedido</label><input name="dataPedido" type="date" value="${editing?.dataPedido||todayISO()}"></div>
        <div class="field"><label>Data de entrega prevista</label><input name="dataEntrega" type="date" value="${editing?.dataEntrega||''}"></div>
      </div>

      <div class="field">
        <label>Pagamento</label>
        <div style="display:flex; gap:18px; align-items:center; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="radio" name="pago" value="0" id="radioNaoPago" ${!editing?.pago?'checked':''}> Não pago</label>
          <label style="display:flex; align-items:center; gap:6px; font-weight:400;"><input type="radio" name="pago" value="1" id="radioPago" ${editing?.pago?'checked':''}> Pago</label>
          <div id="campoDataPagamento" style="display:${editing?.pago?'flex':'none'}; align-items:center; gap:6px;">
            <label style="font-weight:400; margin:0;">em</label>
            <input type="date" name="dataPagamento" value="${editing?.dataPagamento||todayISO()}" style="padding:6px 8px;">
          </div>
        </div>
      </div>

      <div class="field">
        <label>Itens do pedido</label>
        <div id="itemsArea">${itemsAreaHTML()}</div>
        <button type="button" class="btn ghost sm" id="addItem" style="margin-top:6px;">${ICON_PLUS}Adicionar item</button>
      </div>

      <div class="field-row three">
        <div class="field"><label>Valor manual (se não usar itens)</label><input name="valorManual" type="number" step="0.01" min="0" value="${editing?.valorManual??''}"></div>
        <div class="field"><label>Forma de pagamento</label>
          <select name="formaPagamento" id="formaPagamentoSelect">
            <option value="PIX" ${(editing?.formaPagamento||'PIX')==='PIX'?'selected':''}>PIX</option>
            <option value="Cartão de Crédito" ${editing?.formaPagamento==='Cartão de Crédito'?'selected':''}>Cartão de Crédito</option>
            <option value="Cartão de Débito" ${editing?.formaPagamento==='Cartão de Débito'?'selected':''}>Cartão de Débito</option>
            <option value="Dinheiro" ${editing?.formaPagamento==='Dinheiro'?'selected':''}>Dinheiro</option>
          </select>
        </div>
        <div class="field"><label>Outras despesas extras (R$)</label><input name="custoExtra" type="number" step="0.01" min="0" value="${editing?.custoExtra??0}"></div>
      </div>

      <div class="field-row" id="cartaoFields" style="display:none;">
        <div class="field"><label>Juros/taxa do cartão (%)</label><input name="taxaCartaoPercent" type="number" step="0.01" min="0" value="${editing?.taxaCartaoPercent??0}"></div>
        <div class="field"><label>Parcelas</label>
          <select name="parcelas">
            ${Array.from({length:12},(_,i)=>i+1).map(n=>`<option value="${n}" ${(editing?.parcelas||1)===n?'selected':''}>${n}x</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="field"><label>Observações</label><textarea name="obs">${esc(editing?.obs||'')}</textarea></div>

      <div class="totals-box" id="totalsBox"></div>

      <div class="modal-actions">
        <button type="button" class="btn secondary" id="mCancel">Cancelar</button>
        <button type="submit" class="btn">${editing?'Salvar alterações':'Criar pedido'}</button>
      </div>
    </form>
  `, true);

  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);

  function toggleCartaoFields(){
    const forma = document.getElementById('formaPagamentoSelect').value;
    const isCartao = forma === 'Cartão de Crédito' || forma === 'Cartão de Débito';
    document.getElementById('cartaoFields').style.display = isCartao ? 'grid' : 'none';
  }

  function updateTotals(){
    const f = new FormData(document.getElementById('formPedido'));
    const rascunho = pedidoRascunho(f);
    const venda = rascunho.itens.length ? rascunho.itens.reduce((s,it)=>s+it.preco*it.qtd+itemAcrescimoTotal(it),0) : rascunho.valorManual;
    const custoItens = rascunho.itens.reduce((s,it)=> s + itemCustoTotal(it), 0);
    const isCartao = rascunho.formaPagamento==='Cartão de Crédito' || rascunho.formaPagamento==='Cartão de Débito';
    const taxaCartao = isCartao ? venda * (rascunho.taxaCartaoPercent/100) : 0;
    const lucroLiquido = venda - custoItens - taxaCartao - rascunho.custoExtra;

    document.getElementById('totalsBox').innerHTML = `
      <div class="row"><span>Valor Bruto (venda)</span><b>${fmtMoney(venda)}</b></div>
      <div class="row"><span>Custo dos itens (produto + extras)</span><b>-${fmtMoney(custoItens)}</b></div>
      ${isCartao ? `<div class="row"><span>Taxa do cartão (${rascunho.taxaCartaoPercent||0}%)</span><b>-${fmtMoney(taxaCartao)}</b></div>` : ''}
      ${rascunho.custoExtra ? `<div class="row"><span>Outras despesas extras</span><b>-${fmtMoney(rascunho.custoExtra)}</b></div>` : ''}
      <div class="row final"><span>Lucro líquido</span><b>${fmtMoney(lucroLiquido)}</b></div>
    `;
  }

  function bindItemEvents(){
    document.querySelectorAll('.item-row-card').forEach(card=>{
      const idx = Number(card.dataset.idx);
      card.querySelector('.it-produto').addEventListener('change', e=>{
        itens[idx].produtoId = e.target.value;
        const prod = produtoById(e.target.value);
        if(prod){ itens[idx].preco = prod.preco; }
        refreshItemsArea();
      });
      card.querySelector('.it-qtd').addEventListener('input', e=>{ itens[idx].qtd = e.target.value; updateTotals(); });
      card.querySelector('.it-preco').addEventListener('input', e=>{ itens[idx].preco = e.target.value; updateTotals(); });
      card.querySelector('.it-data-entrega').addEventListener('change', e=>{ itens[idx].dataEntrega = e.target.value; refreshItemsArea(); });
      card.querySelector('.it-remove').addEventListener('click', ()=>{ itens.splice(idx,1); refreshItemsArea(); });
      card.querySelector('.it-add-extra').addEventListener('change', e=>{
        const extraId = e.target.value;
        if(!extraId) return;
        itens[idx].extras = itens[idx].extras || [];
        const existing = itens[idx].extras.find(ex=>ex.itemExtraId===extraId);
        if(existing){ existing.qtd = (Number(existing.qtd)||1) + 1; }
        else { itens[idx].extras.push({itemExtraId:extraId, qtd:1}); }
        refreshItemsArea();
      });
      card.querySelectorAll('.extra-remove').forEach(btn=>{
        btn.addEventListener('click', e=>{
          const iIdx = Number(e.currentTarget.dataset.itemIdx);
          const exIdx = Number(e.currentTarget.dataset.extraIdx);
          itens[iIdx].extras.splice(exIdx,1);
          refreshItemsArea();
        });
      });
    });
  }
  function refreshItemsArea(){
    document.getElementById('itemsArea').innerHTML = itemsAreaHTML();
    bindItemEvents();
    updateTotals();
  }
  document.getElementById('addItem')?.addEventListener('click', ()=>{
    itens.push({produtoId:'', qtd:1, preco: DB.produtos[0]?.preco || 0, extras:[]});
    refreshItemsArea();
  });
  document.getElementById('formaPagamentoSelect').addEventListener('change', ()=>{ toggleCartaoFields(); updateTotals(); });
  document.querySelectorAll('input[name="pago"]').forEach(r=> r.addEventListener('change', ()=>{
    document.getElementById('campoDataPagamento').style.display = document.getElementById('radioPago').checked ? 'flex' : 'none';
  }));
  document.querySelector('[name="valorManual"]').addEventListener('input', updateTotals);
  document.querySelector('[name="custoExtra"]').addEventListener('input', updateTotals);
  document.querySelector('[name="taxaCartaoPercent"]').addEventListener('input', updateTotals);

  bindItemEvents();
  toggleCartaoFields();
  updateTotals();

  document.getElementById('formPedido').addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const itensLimpos = itens.filter(it=>it.produtoId).map(it=>({
      produtoId:it.produtoId, qtd:Number(it.qtd)||1, preco:Number(it.preco)||0,
      extras:(it.extras||[]).map(ex=>({itemExtraId:ex.itemExtraId, qtd:Number(ex.qtd)||1})),
      dataEntrega: it.dataEntrega||''
    }));
    const newStatus = f.get('status');

    const obj = {
      clienteId: f.get('clienteId'),
      status: newStatus,
      dataPedido: f.get('dataPedido'),
      dataEntrega: f.get('dataEntrega'),
      itens: itensLimpos,
      valorManual: parseFloat(f.get('valorManual'))||0,
      custoExtra: parseFloat(f.get('custoExtra'))||0,
      formaPagamento: f.get('formaPagamento'),
      taxaCartaoPercent: parseFloat(f.get('taxaCartaoPercent'))||0,
      parcelas: parseInt(f.get('parcelas'),10)||1,
      obs: f.get('obs').trim(),
      pago: f.get('pago')==='1',
      dataPagamento: f.get('dataPagamento') || '',
      estoqueAdicionado: editing?.estoqueAdicionado || false,
      estoqueDebitado: editing?.estoqueDebitado || false
    };
    if(!obj.clienteId){ alert('Selecione um cliente.'); return; }

    // Automações de estoque por status do pedido
    if(newStatus === 'pronto' && !obj.estoqueAdicionado){
      itensLimpos.forEach(it => {
        setEstoqueQtd(it.produtoId, estoqueQtd(it.produtoId) + it.qtd);
      });
      obj.estoqueAdicionado = true;
    }

    if(newStatus === 'entregue' && !obj.estoqueDebitado){
      itensLimpos.forEach(it => {
        setEstoqueQtd(it.produtoId, estoqueQtd(it.produtoId) - it.qtd);
        (it.extras||[]).forEach(ex => {
          const totalExtra = Number(ex.qtd||1) * Number(it.qtd||1);
          setEstoqueExtraQtd(ex.itemExtraId, estoqueExtraQtd(ex.itemExtraId) - totalExtra);
        });
      });
      obj.estoqueDebitado = true;
    }

    if(editing){ Object.assign(editing, obj); }
    else { obj.id = uid(); DB.pedidos.push(obj); }
    save(); closeModal(); renderPedidos();
  });
}

/* =========================================================
   AUTENTICAÇÃO LOCAL (usuário/senha, com hash, aprovação e admin)
   ========================================================= */
const ADMIN_USERNAME = 'viniciusgolim';
const ADMIN_PASSWORD_PADRAO = 'Vini1712@';
const SESSAO_KEY = 'sessao_usuario';
const ULTIMA_ATIVIDADE_KEY = 'ultima_atividade';
const LIMITE_INATIVIDADE_MS = 30*60*1000;
function marcarAtividade(){ try{ localStorage.setItem(ULTIMA_ATIVIDADE_KEY, Date.now().toString()); }catch(e){} }
function sessaoExpirada(){
  const t = parseInt(localStorage.getItem(ULTIMA_ATIVIDADE_KEY)||'0', 10);
  return !t || (Date.now() - t) > LIMITE_INATIVIDADE_MS;
}
let currentUserRecord = null;

async function sha256(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function usuarioById(usuario){
  return DB.usuarios.find(u => u.usuario.toLowerCase() === (usuario||'').trim().toLowerCase());
}
async function seedAdminUser(){
  if(!usuarioById(ADMIN_USERNAME)){
    DB.usuarios.push({
      usuario: ADMIN_USERNAME, nome:'Administrador',
      senhaHash: await sha256(ADMIN_PASSWORD_PADRAO),
      aprovado:true, admin:true, criadoEm:new Date().toISOString()
    });
    save();
  }
}

function renderLoginScreen(){
  const usuarioLembrado = localStorage.getItem('usuario_lembrado') || '';
  const senhaLembrada = localStorage.getItem('senha_lembrada') || '';
  document.getElementById('authCard').innerHTML = `
    <div class="brand"><div class="brand-mark">${DB.config.logoFoto?`<img src="${DB.config.logoFoto}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`:'3D'}</div>
      <div class="brand-text"><b>${esc(DB.config.appNome||'Vini Makers')}</b><span>${esc(DB.config.appSubtitulo||'Gestão 3D')}</span></div></div>
    <h2>Entrar</h2>
    <p class="hint" style="text-align:center; margin-bottom:18px;">Acesso restrito — somente contas aprovadas.</p>
    <form id="formLogin">
      <div class="field"><label>Usuário</label><input type="text" name="usuario" required autocomplete="username" value="${esc(usuarioLembrado)}"></div>
      <div class="field"><label>Senha</label><input type="password" name="senha" required autocomplete="current-password" value="${esc(senhaLembrada)}"></div>
      <label style="display:flex; align-items:center; justify-content:flex-start; gap:8px; font-weight:400; font-size:13px; margin:2px 0 14px 0; text-align:left; cursor:pointer;">
        <input type="checkbox" id="chkLembrar" style="width:15px; height:15px; flex-shrink:0; margin:0;" ${usuarioLembrado?'checked':''}>
        <span style="white-space:nowrap;">Lembrar login</span>
      </label>
      <div id="loginErro" class="hint" style="color:var(--danger); min-height:16px;"></div>
      <button type="submit" class="btn" style="width:100%; justify-content:center; margin-top:6px;">Entrar</button>
    </form>
    <div style="text-align:center; margin-top:14px;">
      <a href="#" id="linkCriarConta" style="font-size:12.5px; color:var(--accent);">Criar conta</a>
    </div>
  `;
  document.getElementById('formLogin').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const erroEl = document.getElementById('loginErro');
    erroEl.textContent = 'Verificando…';
    await sincronizarAntesDoAuth();
    const user = usuarioById(f.get('usuario'));
    const hash = await sha256(f.get('senha'));
    if(!user || user.senhaHash !== hash){ erroEl.textContent = 'Usuário ou senha incorretos.'; return; }
    if(!user.aprovado){ renderPendingScreen('Sua conta ainda não foi aprovada pelo administrador.'); return; }
    if(document.getElementById('chkLembrar').checked){
      localStorage.setItem('usuario_lembrado', user.usuario);
      localStorage.setItem('senha_lembrada', f.get('senha'));
    } else {
      localStorage.removeItem('usuario_lembrado');
      localStorage.removeItem('senha_lembrada');
    }
    localStorage.setItem(SESSAO_KEY, user.usuario);
    marcarAtividade();
    currentUserRecord = user;
    unlockApp();
  });
  document.getElementById('linkCriarConta').addEventListener('click', e=>{ e.preventDefault(); renderSignupScreen(); });
}

function renderSignupScreen(){
  document.getElementById('authCard').innerHTML = `
    <h2>Criar conta</h2>
    <p class="hint" style="text-align:center; margin-bottom:18px;">Sua conta ficará aguardando aprovação do administrador.</p>
    <form id="formSignup">
      <div class="field"><label>Nome</label><input type="text" name="nome" required></div>
      <div class="field"><label>Usuário</label><input type="text" name="usuario" required autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" name="senha" required minlength="4" autocomplete="new-password"></div>
      <div id="signupErro" class="hint" style="color:var(--danger); min-height:16px;"></div>
      <button type="submit" class="btn" style="width:100%; justify-content:center; margin-top:6px;">Criar conta</button>
    </form>
    <div style="text-align:center; margin-top:14px;">
      <a href="#" id="linkVoltarLogin" style="font-size:12.5px; color:var(--text-muted);">Já tenho conta — entrar</a>
    </div>
  `;
  document.getElementById('linkVoltarLogin').addEventListener('click', e=>{ e.preventDefault(); renderLoginScreen(); });
  document.getElementById('formSignup').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const erroEl = document.getElementById('signupErro');
    const usuario = f.get('usuario').trim();
    erroEl.textContent = 'Verificando…';
    await sincronizarAntesDoAuth();
    if(usuarioById(usuario)){ erroEl.textContent = 'Esse usuário já existe.'; return; }
    const novo = {
      usuario, nome: f.get('nome').trim(),
      senhaHash: await sha256(f.get('senha')),
      aprovado:false, admin:false, criadoEm:new Date().toISOString()
    };
    DB.usuarios.push(novo);
    save();
    renderPendingScreen('Conta criada! Aguarde a aprovação do administrador para acessar.');
  });
}

function renderPendingScreen(msg){
  document.getElementById('authCard').innerHTML = `
    <div class="brand"><div class="brand-mark">3D</div><div class="brand-text"><b>${esc(DB.config.appNome||'Vini Makers')}</b><span>${esc(DB.config.appSubtitulo||'Gestão 3D')}</span></div></div>
    <h2>Aguardando aprovação</h2>
    <p class="hint" style="text-align:center; margin-bottom:18px;">${esc(msg)}</p>
    <button type="button" class="btn secondary" id="btnVoltarPending" style="width:100%; justify-content:center;">Voltar ao login</button>
  `;
  document.getElementById('btnVoltarPending').addEventListener('click', renderLoginScreen);
}

async function sincronizarAntesDoAuth(){
  try{
    await pullFromCloud(false);
    if(getFirebaseConfig()?.databaseURL) await firebasePull(false);
  }catch(e){}
}

function unlockApp(){
  document.body.classList.remove('app-locked');
  document.getElementById('navUsuarios').style.display = currentUserRecord?.admin ? 'flex' : 'none';
  const footer = document.getElementById('userInfoFooter');
  if(footer) footer.textContent = `${currentUserRecord?.nome||currentUserRecord?.usuario} ${currentUserRecord?.admin?'(admin)':''}`;
  goTo('dashboard');
  applyBranding();
}

async function renderAuthGate(){
  document.body.classList.add('app-locked');
  document.getElementById('authCard').innerHTML = '<p class="hint" style="text-align:center;">Carregando…</p>';
  if(sessaoExpirada()){ localStorage.removeItem(SESSAO_KEY); }
  await sincronizarAntesDoAuth();
  await seedAdminUser();
  const sessao = localStorage.getItem(SESSAO_KEY);
  const user = sessao ? usuarioById(sessao) : null;
  if(user && user.aprovado){ currentUserRecord = user; marcarAtividade(); unlockApp(); return; }
  if(user && !user.aprovado){ renderPendingScreen('Sua conta ainda não foi aprovada pelo administrador.'); return; }
  renderLoginScreen();
}
['click','keydown','mousemove','touchstart'].forEach(ev=>{
  document.addEventListener(ev, ()=>{ if(!document.body.classList.contains('app-locked')) marcarAtividade(); }, {passive:true});
});
setInterval(()=>{
  if(!document.body.classList.contains('app-locked') && sessaoExpirada()){
    localStorage.removeItem(SESSAO_KEY);
    document.body.classList.add('app-locked');
    renderLoginScreen();
  }
}, 60000);

/* =========================================================
   USUÁRIOS (aprovação de contas — somente admin)
   ========================================================= */
function renderUsuarios(){
  pageEl.innerHTML = `
    <div class="page-head">
      <div><h1>Usuários</h1><p>Aprove ou revogue o acesso de contas ao sistema.</p></div>
      <button class="btn secondary" id="btnAtualizarUsuarios">🔄 Atualizar</button>
    </div>
    <div class="panel" id="usuariosPanel">Sincronizando…</div>
  `;
  document.getElementById('btnAtualizarUsuarios').addEventListener('click', carregarUsuariosAtualizados);
  carregarUsuariosAtualizados();
}
async function carregarUsuariosAtualizados(){
  await sincronizarAntesDoAuth();
  desenharUsuarios();
}
function desenharUsuarios(){
  const painel = document.getElementById('usuariosPanel');
  const lista = DB.usuarios;
  painel.innerHTML = `
    <h2>Contas <span class="count">${lista.length}</span></h2>
    ${lista.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Nome</th><th>Usuário</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${lista.map(u=>`
          <tr>
            <td><b>${esc(u.nome||'—')}</b></td>
            <td>${esc(u.usuario||'—')}</td>
            <td>${u.admin? '<span class="badge b-aprovado">Admin</span>' : (u.aprovado? '<span class="badge b-pronto">Aprovado</span>' : '<span class="badge b-pos">Pendente</span>')}</td>
            <td><div class="row-actions">
              ${!u.admin ? (u.aprovado
                  ? `<button class="btn sm secondary" data-revogar="${esc(u.usuario)}">Revogar acesso</button>`
                  : `<button class="btn sm" data-aprovar="${esc(u.usuario)}">Aprovar</button>`) : ''}
              ${!u.admin ? `<button class="icon-btn" data-del-usuario="${esc(u.usuario)}">${ICON_TRASH}</button>` : ''}
            </div></td>
          </tr>`).join('')}
      </tbody>
    </table></div>` : '<p class="hint">Nenhuma conta cadastrada ainda.</p>'}
  `;
  document.querySelectorAll('[data-aprovar]').forEach(b=> b.addEventListener('click', ()=>{
    usuarioById(b.dataset.aprovar).aprovado = true; save(); desenharUsuarios();
  }));
  document.querySelectorAll('[data-revogar]').forEach(b=> b.addEventListener('click', ()=>{
    usuarioById(b.dataset.revogar).aprovado = false; save(); desenharUsuarios();
  }));
  document.querySelectorAll('[data-del-usuario]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm('Excluir esta conta?')) return;
    DB.usuarios = DB.usuarios.filter(u=>u.usuario!==b.dataset.delUsuario);
    save(); desenharUsuarios();
  }));
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('btnSair').addEventListener('click', ()=>{
  localStorage.removeItem(SESSAO_KEY);
  currentUserRecord = null;
  document.body.classList.add('app-locked');
  renderLoginScreen();
});
renderAuthGate();

// Registra o service worker (só funciona quando o app está hospedado via http/https,
// junto com o arquivo service-worker.js — necessário para instalar como app real)
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{ /* arquivo não hospedado junto; ignora */ });
  });
}
