<style>
  :root{
    --bg: #1b1d21;
    --surface: #232629;
    --surface-2: #2a2e33;
    --surface-hover: #30353b;
    --border: #383d44;
    --text: #eceef0;
    --text-muted: #90969f;
    --accent: #3fc1b0;
    --accent-strong: #2fa898;
    --accent-soft: rgba(63,193,176,0.12);
    --warn: #f2a93b;
    --warn-soft: rgba(242,169,59,0.14);
    --danger: #e15554;
    --danger-soft: rgba(225,85,84,0.14);
    --success: #7ee089;
    --success-soft: rgba(126,224,137,0.16);
    --success-dark: #2f9e50;
    --success-dark-soft: rgba(47,158,80,0.20);
    --whats: #25d366;
    --radius: 10px;
    --font-ui: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent); color:#0e1210;}

  /* ---------- layout shell ---------- */
  .shell{display:flex; min-height:100vh;}

  .sidebar{
    width:232px;
    flex-shrink:0;
    background:#18191c;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    position:sticky;
    top:0;
    height:100vh;
    transition:width .18s ease, padding .18s ease;
    overflow:hidden;
  }
  .sidebar.collapsed{width:0; padding:0; border-right:none;}
  .sidebar.collapsed *{opacity:0; pointer-events:none;}
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 22px 8px;
  }
  .brand-mark{
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(135deg,var(--accent),#1d7d70);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:600; color:#0e1210; font-size:13px;
    cursor:pointer; overflow:hidden; flex-shrink:0;
  }
  .brand-text{line-height:1.15;}
  .brand-text b{display:block; font-size:14.5px; font-weight:600; letter-spacing:.2px;}
  .brand-text span{display:block; font-size:11px; color:var(--text-muted); font-family:var(--font-mono);}

  nav{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px;
    color:var(--text-muted); text-decoration:none;
    font-size:14px; cursor:pointer; border:1px solid transparent;
    transition:background .12s ease, color .12s ease;
    user-select:none;
  }
  .nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:.85;}
  .nav-item:hover{background:var(--surface); color:var(--text);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent); border-color:rgba(63,193,176,.25);}
  .nav-item.active svg{opacity:1;}

  .sidebar-footer{
    margin-top:auto; padding-top:14px; border-top:1px solid var(--border);
    font-size:11px; color:var(--text-muted); font-family:var(--font-mono); line-height:1.5;
  }

  /* Auth gate (login / cadastro / aprovação) */
  body.app-locked .shell{display:none;}
  .auth-gate{
    display:none; position:fixed; inset:0; z-index:200;
    background:var(--bg); align-items:center; justify-content:center; padding:20px;
  }
  body.app-locked .auth-gate{display:flex;}
  .auth-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:28px 26px;
  }
  .auth-card .brand{padding:0 0 18px 0; justify-content:center;}
  .auth-card h2{margin:0 0 4px 0; text-align:center; font-size:19px;}

  main{flex:1; min-width:0; padding:28px 34px 60px 34px;}

  .page-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:22px; gap:16px; flex-wrap:wrap;
  }
  .page-head h1{font-size:22px; margin:0 0 4px 0; font-weight:600; letter-spacing:.2px;}
  .page-head p{margin:0; color:var(--text-muted); font-size:13.5px; max-width:520px;}

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--accent); color:#0e1210; border:none;
    padding:9px 15px; border-radius:8px; font-family:var(--font-ui);
    font-weight:600; font-size:13.5px; cursor:pointer;
    transition:background .12s ease, transform .05s ease;
    white-space:nowrap;
  }
  .btn:hover{background:var(--accent-strong);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn.secondary:hover{background:var(--surface-hover);}
  .btn.danger{background:var(--danger-soft); color:var(--danger); border:1px solid rgba(225,85,84,.3);}
  .btn.danger:hover{background:rgba(225,85,84,.22);}
  .btn.ghost{background:transparent; color:var(--text-muted); border:1px solid var(--border); padding:7px 11px; font-size:12.5px;}
  .btn.ghost:hover{color:var(--text); border-color:var(--text-muted);}
  .btn.sm{padding:6px 10px; font-size:12.5px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- dashboard cards ---------- */
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px;}
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px;
  }
  .kpi .label{font-size:12px; color:var(--text-muted); margin-bottom:8px;}
  .kpi .value{font-family:var(--font-mono); font-size:22px; font-weight:600;}
  .kpi .sub{font-size:11.5px; color:var(--text-muted); margin-top:4px;}
  .kpi.accent{border-color:rgba(63,193,176,.35); background:linear-gradient(180deg, rgba(63,193,176,.06), transparent);}
  .kpi.warn{border-color:rgba(242,169,59,.35);}
  .kpi.warn .value{color:var(--warn);}
  .kpi.danger{border-color:rgba(225,85,84,.35);}
  .kpi.danger .value{color:var(--danger);}
  .kpi.success{border-color:rgba(107,203,119,.35);}
  .kpi.success .value{color:var(--success);}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:20px;
  }
  .panel h2{font-size:15px; margin:0 0 14px 0; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .panel h2 span.count{font-family:var(--font-mono); color:var(--text-muted); font-size:11.5px; font-weight:500;}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; padding:9px 12px; color:var(--text-muted);
    font-weight:500; font-size:11.5px; letter-spacing:.3px;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{font-family:var(--font-mono);}
  td.mono{font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    width:28px; height:28px; border-radius:7px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--text-muted);}
  .icon-btn svg{width:14px; height:14px;}
  .whatsapp-btn{background:rgba(37,211,102,.12); color:var(--whats); border:1px solid rgba(37,211,102,.3);}
  .whatsapp-btn:hover{background:rgba(37,211,102,.22); color:var(--whats);}

  .empty{
    text-align:center; padding:40px 20px; color:var(--text-muted);
  }
  .empty svg{width:34px; height:34px; opacity:.4; margin-bottom:10px;}
  .empty p{margin:0 0 14px 0; font-size:13.5px;}

  /* ---------- badges ---------- */
  .badge{
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 9px; border-radius:20px; font-size:11.5px; font-weight:600;
    font-family:var(--font-mono); white-space:nowrap;
  }
  .badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .b-emorcamento{background:rgba(150,150,155,.14); color:#9a9aa0;}
  .b-orcamento{background:var(--surface-2); color:var(--text-muted);}
  .b-aprovado{background:var(--accent-soft); color:var(--accent);}
  .b-imprimindo{background:rgba(107,157,203,.14); color:#6d9dcb;}
  .b-pos{background:var(--warn-soft); color:var(--warn);}
  .b-pronto{background:var(--success-soft); color:var(--success);}
  .b-entregue{background:var(--success-dark-soft); color:var(--success-dark);}
  .b-cancelado{background:var(--danger-soft); color:var(--danger);}

  .stock-low{color:var(--danger); font-weight:600;}

  /* ---------- multi-select filter chips ---------- */
  .chip-filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chip-toggle{
    cursor:pointer; border:none; font-family:var(--font-mono);
    transition:opacity .15s ease, box-shadow .15s ease, transform .08s ease;
  }
  .chip-toggle.chip-inactive{opacity:.38;}
  .chip-toggle.chip-active{opacity:1; box-shadow:0 0 0 1.5px currentColor inset;}
  .chip-toggle:hover{opacity:.85;}
  .chip-toggle:active{transform:scale(.95);}
  .chip-clear{
    background:none; border:none; color:var(--text-muted); font-size:11.5px;
    cursor:pointer; text-decoration:underline; padding:4px 2px; white-space:nowrap;
  }
  .chip-clear:hover{color:var(--text);}

  /* ---------- clickable rows (duplo clique abre o item) ---------- */
  tbody tr[data-dbl]{cursor:pointer;}

  /* ---------- painéis sanfona (collapsible) ---------- */
  details.panel > summary{
    list-style:none; cursor:pointer; margin:0 0 14px 0;
    font-size:15px; font-weight:600; color:var(--text);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  details.panel > summary::-webkit-details-marker{ display:none; }
  details.panel > summary::marker{ content:''; }
  details.panel:not([open]) > summary{ margin-bottom:0; }
  details.panel > summary:hover{ color:var(--accent); }
  details.panel > summary .count{font-family:var(--font-mono); color:var(--text-muted); font-size:11.5px; font-weight:500;}
  details.panel > summary .chev{ margin-left:auto; color:var(--text-muted); transition:transform .2s ease; flex-shrink:0; display:flex; }
  details.panel > summary .chev svg{ width:16px; height:16px; display:block; }
  details.panel[open] > summary .chev{ transform:rotate(180deg); }

  /* ---------- search/filter bar ---------- */
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .search-box{
    flex:1; min-width:180px; position:relative;
  }
  .search-box input{width:100%;}
  .search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-muted);}
  .search-box input{padding-left:32px;}

  input, select, textarea{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:7px; padding:9px 11px; font-family:var(--font-ui); font-size:13.5px;
    outline:none; width:100%;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--accent);}
  select{cursor:pointer;}
  textarea{resize:vertical; min-height:64px;}
  label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:500;}
  .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}

  /* ---------- avatar / foto ---------- */
  .avatar-img{border-radius:50%; object-fit:cover; display:block; flex-shrink:0;}
  .avatar-fallback{
    border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:600; flex-shrink:0;
  }
  .avatar-upload{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .avatar-upload .avatar-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- phone / cep groups ---------- */
  .phone-group{display:flex; gap:8px; align-items:center;}
  .phone-prefix{
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    padding:9px 10px; font-family:var(--font-mono); color:var(--text-muted); font-size:13.5px;
    flex-shrink:0;
  }
  .cep-group{display:flex; gap:8px; align-items:center;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,11,12,.62);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 20px; z-index:50; overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:560px; padding:24px 26px 22px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .modal.wide{max-width:720px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-head h3{margin:0; font-size:17px; font-weight:600;}
  .modal-close{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px;}
  .modal-close:hover{color:var(--text);}
  .modal-close svg{width:18px; height:18px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border);}

  /* order items builder */
  .item-row{
    display:grid; grid-template-columns:2fr 70px 90px 28px; gap:8px; align-items:center; margin-bottom:8px;
  }
  .item-row .icon-btn{width:28px; height:28px;}
  .items-total{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:12px; margin-top:4px; border-top:1px dashed var(--border);
    font-size:14px;
  }
  .items-total b{font-family:var(--font-mono); font-size:17px; color:var(--accent);}

  /* dynamic colors list */
  .color-row{
    display:flex; gap:8px; align-items:center; margin-bottom:8px;
  }
  .color-badge-preview{
    width:24px; height:24px; border-radius:4px; border:1px solid var(--border); flex-shrink:0;
  }
  /* color chip shown in products table — no dot bullet */
  .color-chip{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 8px 3px 3px; border-radius:20px; font-size:11.5px; font-weight:500;
    background:var(--surface-2); border:1px solid var(--border); white-space:nowrap;
  }
  .color-chip .swatch{
    width:14px; height:14px; border-radius:50%; border:1px solid rgba(255,255,255,.15); flex-shrink:0;
  }

  /* itens extras (acessórios) */
  .extra-item-row{
    display:grid; grid-template-columns:2fr 100px 28px; gap:8px; align-items:center; margin-bottom:8px;
  }
  .extra-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--accent-soft); color:var(--accent); border:1px solid rgba(63,193,176,.3);
    padding:4px 6px 4px 4px; border-radius:20px; font-size:12px; font-weight:600; margin:3px 6px 3px 0;
  }
  .extra-chip img{border-radius:50%!important;}
  .extra-chip .extra-remove{
    background:none; border:none; color:var(--accent); cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; width:16px; height:16px; opacity:.75;
  }
  .extra-chip .extra-remove:hover{opacity:1;}
  .extra-chip .extra-remove svg{width:12px; height:12px;}
  .item-extras-area{margin:6px 0;}
  .item-cost-preview{
    font-size:12px; color:var(--text-muted); margin-top:4px; font-family:var(--font-mono);
  }
  .item-cost-preview b{color:var(--text);}
  .item-row-card{
    border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px; background:var(--surface-2);
  }

  /* pagamento / cartão */
  .totals-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:14px 16px; margin-top:6px; display:flex; flex-direction:column; gap:6px;
  }
  .totals-box .row{display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted);}
  .totals-box .row b{color:var(--text); font-family:var(--font-mono);}
  .totals-box .row.final{border-top:1px dashed var(--border); padding-top:8px; margin-top:2px; font-size:14.5px;}
  .totals-box .row.final b{color:var(--accent); font-size:17px;}

  /* stock tabs & controls */
  .stock-tabs{
    display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px;
  }
  .stock-tab{
    padding:8px 14px; border-radius:6px 6px 0 0; background:transparent; border:none;
    color:var(--text-muted); cursor:pointer; font-weight:500; font-size:13px;
  }
  .stock-tab.active{
    background:var(--surface-2); color:var(--accent); border-bottom:2px solid var(--accent);
  }

  .hint{font-size:11.5px; color:var(--text-muted); margin-top:5px;}

  @media (max-width: 860px){
    .sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);}
    main{padding:20px 16px 50px 16px;}
    .field-row, .field-row.three{grid-template-columns:1fr;}
    .menu-btn{display:flex !important;}
  }
  .menu-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer; margin-bottom:14px;
    flex-shrink:0;
  }
</style>
</head>

<script>
/* =========================================================
   ESTADO / PERSISTÊNCIA
   ========================================================= */
const DB_KEY = 'print3d_manager_v2';
const STATUS_LIST = [
  {id:'emorcamento', label:'Em orçamento',      cls:'b-emorcamento'},
  {id:'orcamento',  label:'Orçamento enviado',  cls:'b-orcamento'},
  {id:'aprovado',   label:'Aprovado',         cls:'b-aprovado'},
  {id:'imprimindo', label:'Imprimindo',       cls:'b-imprimindo'},
  {id:'pos',        label:'Pós-processamento',cls:'b-pos'},
  {id:'pronto',     label:'Pronto',           cls:'b-pronto'},
  {id:'entregue',   label:'Entregue',         cls:'b-entregue'},
  {id:'cancelado',  label:'Cancelado',        cls:'b-cancelado'},
];

function normalizeDB(db){
  if(!db) db = { clientes:[], produtos:[], estoque:[], pedidos:[], itensExtras:[], filamentoTipos:[], filamentoEstoque:[], filamentoTaras:[], usuarios:[], config:{} };
  
  db.config = db.config || {};
  if(db.config.logoFoto === undefined) db.config.logoFoto = '';
  if(!db.config.appNome) db.config.appNome = 'Vini Makers';
  if(!db.config.appSubtitulo) db.config.appSubtitulo = 'Gestão 3D';
  if(db.config.limiteBaixoProdutos === undefined) db.config.limiteBaixoProdutos = db.config.limiteEstoqueBaixo ?? 5;
  if(db.config.limiteBaixoItensAdicionais === undefined) db.config.limiteBaixoItensAdicionais = 5;
  if(db.config.limiteBaixoFilamentos === undefined) db.config.limiteBaixoFilamentos = 200;
  db.clientes = (db.clientes||[]).map(c=>({
    telefone:'', email:'', cep:'', logradouro:c.endereco||'', numero:'', complemento:'', bairro:'', cidade:'', uf:'', obs:'', foto:'', ...c
  }));
  db.produtos = (db.produtos||[]).map(p=>({
    cores: p.cores || (p.cor ? [{nome: p.cor, hex: '#3fc1b0'}] : []),
    foto: p.foto || '',
    ...p
  }));
  db.itensExtras = db.itensExtras && db.itensExtras.length ? db.itensExtras.map(e=>({custo:0, foto:'', tipoValor:'debito', ...e})) : [
    {id:'ext-argola-c-dourada', nome:'Argola com corrente dourada', custo:0, foto:''},
    {id:'ext-argola-s-dourada', nome:'Argola sem corrente dourada', custo:0, foto:''},
    {id:'ext-argola-c-prata',   nome:'Argola com corrente prata',   custo:0, foto:''},
    {id:'ext-argola-s-prata',   nome:'Argola sem corrente prata',   custo:0, foto:''},
    {id:'ext-vela-led',         nome:'Vela de LED',                 custo:0, foto:''},
  ];
  db.pedidos = (db.pedidos||[]).map(p=>({
    custoExtra:0, 
    estoqueAdicionado: p.estoqueAdicionado || false,
    estoqueDebitado: p.estoqueDebitado || false,
    formaPagamento: p.formaPagamento || p.pagamento || 'PIX',
    taxaCartaoPercent: p.taxaCartaoPercent ?? 0,
    parcelas: p.parcelas ?? 1,
    pago: p.pago || false,
    dataPagamento: p.dataPagamento || '',
    ...p,
    status: p.status === 'fila' ? 'aprovado' : p.status,
    itens: (p.itens||[]).map(it=>({extras:[], ...it}))
  }));

  // Sincronizar estoque com produtos cadastrados
  db.estoque = db.produtos.map(p => {
    const stEx = (db.estoque||[]).find(e => e.produtoId === p.id);
    return {
      produtoId: p.id,
      quantidade: stEx ? Number(stEx.quantidade)||0 : 0
    };
  });

  // Sincronizar estoque com itens extras (acessórios) cadastrados
  db.estoqueExtras = db.itensExtras.map(ex => {
    const stEx = (db.estoqueExtras||[]).find(e => e.itemExtraId === ex.id);
    return {
      itemExtraId: ex.id,
      quantidade: stEx ? Number(stEx.quantidade)||0 : 0
    };
  });

  // Migração: tara por tipo (formato antigo) -> tara por marca (novo, unificado)
  db.filamentoTaras = db.filamentoTaras || [];
  (db.filamentoTipos||[]).forEach(t=>{
    if(!t.marca || !t.taraAmostras || !t.taraAmostras.length) return;
    let rec = db.filamentoTaras.find(x => (x.marca||'').trim().toLowerCase() === (t.marca||'').trim().toLowerCase());
    if(!rec){ rec = {marca: t.marca, amostras: []}; db.filamentoTaras.push(rec); }
    rec.amostras.push(...t.taraAmostras);
  });
  db.filamentoTaras = db.filamentoTaras.map(t=>({amostras:[], ...t}));
  db.usuarios = db.usuarios || [];
  db.categorias = db.categorias || [];
  db.materiais = db.materiais || [];
  // Migra categorias/materiais já usados nos produtos para as listas cadastráveis
  (db.produtos||[]).forEach(p=>{
    if(p.categoria && !db.categorias.includes(p.categoria)) db.categorias.push(p.categoria);
    if(p.material && !db.materiais.includes(p.material)) db.materiais.push(p.material);
  });
  // Migra materiais já digitados nos registros de estoque de filamento (campo antes era texto livre)
  (db.filamentoEstoque||[]).forEach(r=>{
    if(r.material && !db.materiais.includes(r.material)) db.materiais.push(r.material);
  });

  // Migração: estoque referenciando tipoId (formato antigo) -> registro único e completo (novo)
  db.filamentoEstoque = (db.filamentoEstoque||[]).map(r=>{
    if(r.tipoId && !r.marca){
      const tipo = (db.filamentoTipos||[]).find(t=>t.id===r.tipoId);
      return {
        id: r.id, marca: tipo?.marca||'—', material: tipo?.material||'—',
        preco: tipo?.preco||0, corHex: tipo?.corHex||'#3fc1b0',
        cores: tipo?.corHex ? [{nome:'', hex:tipo.corHex}] : [{nome:'', hex:'#3fc1b0'}],
        pesoBruto: r.pesoBruto||0, obs: r.obs||'', dataRegistro: r.dataRegistro||todayISO()
      };
    }
    return { corHex:'#3fc1b0', preco:0, obs:'', cores: r.cores || (r.corHex ? [{nome:'', hex:r.corHex}] : [{nome:'', hex:'#3fc1b0'}]), ...r };
  });
  delete db.filamentoTipos;

  db.updatedAt = db.updatedAt || 0;
  return db;
}

function loadDB(){
  let db = null;
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) db = JSON.parse(raw);
  }catch(e){ console.error('Erro ao ler dados salvos', e); }
  
  if(!db){
    try{
      const rawV1 = localStorage.getItem('print3d_manager_v1');
      if(rawV1) db = JSON.parse(rawV1);
    }catch(e){}
  }

  return normalizeDB(db);
}

let DB = loadDB();
const CLOUD_KEY = 'gestao3d-db';
let cloudSyncStatus = 'checking'; // 'checking' | 'synced' | 'local-only' | 'error'

function save(){
  DB.updatedAt = Date.now();
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){ alert('Não foi possível salvar os dados neste navegador.'); }
  pushToCloud();
  firebasePush();
}

async function pushToCloud(){
  if(typeof window === 'undefined' || !window.storage) return;
  try{
    await window.storage.set(CLOUD_KEY, JSON.stringify(DB));
    cloudSyncStatus = 'synced';
  }catch(e){
    cloudSyncStatus = 'error';
  }
  updateSyncFooter();
}

async function pullFromCloud(showAlert){
  if(typeof window === 'undefined' || !window.storage){
    cloudSyncStatus = 'local-only';
    updateSyncFooter();
    return;
  }
  try{
    const res = await window.storage.get(CLOUD_KEY);
    if(res && res.value){
      const cloudDB = normalizeDB(JSON.parse(res.value));
      if((cloudDB.updatedAt||0) > (DB.updatedAt||0)){
        DB = cloudDB;
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
        render();
        applyBranding();
        if(showAlert) alert('Dados atualizados com a versão mais recente da nuvem.');
      } else if((DB.updatedAt||0) > (cloudDB.updatedAt||0)){
        await window.storage.set(CLOUD_KEY, JSON.stringify(DB));
      }
      cloudSyncStatus = 'synced';
    } else {
      // ainda não existe nada na nuvem: envia os dados locais como ponto de partida
      await window.storage.set(CLOUD_KEY, JSON.stringify(DB));
      cloudSyncStatus = 'synced';
    }
  }catch(e){
    cloudSyncStatus = 'error';
  }
  updateSyncFooter();
}

/* =========================================================
   SINCRONIZAÇÃO REAL NA NUVEM (Firebase Realtime Database —
   funciona em qualquer navegador/aparelho, com o Firebase do
   próprio usuário)
   ========================================================= */
const DEFAULT_FIREBASE_CONFIG = { databaseURL: 'https://painel3d-default-rtdb.firebaseio.com', authSecret: '', path: 'vinimakers/dados' };
function getFirebaseConfig(){
  try{
    const saved = JSON.parse(localStorage.getItem('firebase_config')||'null');
    if(saved && saved.databaseURL) return saved;
  }catch(e){}
  return DEFAULT_FIREBASE_CONFIG;
}
function setFirebaseConfig(cfg){
  try{ localStorage.setItem('firebase_config', JSON.stringify(cfg)); }catch(e){}
}
function clearFirebaseConfig(){
  try{ localStorage.removeItem('firebase_config'); }catch(e){}
}
function firebaseUrl(cfg, extra=''){
  const base = cfg.databaseURL.replace(/\/$/,'');
  const path = (cfg.path || 'vinimakers/dados').replace(/^\/|\/$/g,'');
  const auth = cfg.authSecret ? `?auth=${encodeURIComponent(cfg.authSecret)}` : '';
  return `${base}/${path}.json${auth}${extra}`;
}

async function firebasePush(){
  const cfg = getFirebaseConfig();
  if(!cfg || !cfg.databaseURL) return false;
  try{
    const res = await fetch(firebaseUrl(cfg), {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(DB)
    });
    return res.ok;
  }catch(e){ return false; }
}

async function firebasePull(showAlert){
  const cfg = getFirebaseConfig();
  if(!cfg || !cfg.databaseURL){
    if(showAlert) alert('Configure o Firebase primeiro na aba "Configurações".');
    return;
  }
  try{
    const res = await fetch(firebaseUrl(cfg));
    if(res.ok){
      const cloudDB = await res.json();
      if(cloudDB && Object.keys(cloudDB).length){
        const normalized = normalizeDB(cloudDB);
        if((normalized.updatedAt||0) > (DB.updatedAt||0)){
          DB = normalized;
          localStorage.setItem(DB_KEY, JSON.stringify(DB));
          render();
          applyBranding();
          if(showAlert) alert('Dados atualizados com a versão mais recente do Firebase!');
        } else if((DB.updatedAt||0) > (normalized.updatedAt||0)){
          await firebasePush();
          if(showAlert) alert('Sua versão local era mais nova — enviada ao Firebase.');
        } else if(showAlert){
          alert('Você já está com os dados mais atuais.');
        }
      } else {
        await firebasePush();
        if(showAlert) alert('Firebase conectado! Seus dados locais foram enviados.');
      }
      cloudSyncStatus = 'synced';
    } else if(showAlert){
      alert('Não foi possível conectar. Verifique a Database URL e as regras de acesso do seu Firebase.');
    }
  }catch(e){
    cloudSyncStatus = 'error';
    if(showAlert) alert('Não foi possível conectar ao Firebase agora. Verifique a URL e sua internet.');
  }
  updateSyncFooter();
}

async function sincronizarAgora(){
  await pullFromCloud(false);
  if(getFirebaseConfig()?.databaseURL) await firebasePull(true);
  else alert('Sincronizado com sucesso via Claude. Para sincronizar entre qualquer navegador/aparelho, configure o Firebase na aba "Configurações".');
}

}

function exportarDados(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gestao-3d-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importarDados(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!confirm('Importar este arquivo vai substituir todos os dados atuais. Deseja continuar?')) return;
      DB = normalizeDB(parsed);
      save();
      render();
      applyBranding();
      alert('Dados importados com sucesso!');
    }catch(err){
      alert('Arquivo inválido. Selecione um backup .json exportado por este sistema.');
    }
  };
  reader.readAsText(file);
}

function fmtMoney(v){
  v = Number(v)||0;
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y) return iso;
  return `${d}/${m}/${y}`;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function statusInfo(id){ return STATUS_LIST.find(s=>s.id===id) || STATUS_LIST[0]; }
const MAPA_CORES = {
  'preto':'#18191c','branco':'#f5f5f5','cinza':'#8a8a8a','cinza claro':'#c4c4c4','cinza escuro':'#4a4a4a',

  'roxo':'#8e24aa','violeta':'#9c27b0','lilas':'#b39ddb','lilás':'#b39ddb','rosa':'#ec407a','rosa claro':'#f8bbd0','pink':'#e91e63',

  'natural':'#e8dcc8','transparente':'#e0e0e0','turquesa':'#1de9b6','magenta':'#e91e63','salmao':'#ff8a65','salmão':'#ff8a65'
};
function corPorNome(nome){
  const chave = (nome||'').trim().toLowerCase();
  return MAPA_CORES[chave] || null;
}
function ordenarLista(lista, campo, dir){
  const arr = [...lista];
  arr.sort((a,b)=>{
    let va = a[campo], vb = b[campo];
    if(typeof va === 'string') va = va.toLowerCase();
    if(typeof vb === 'string') vb = vb.toLowerCase();
    if(va === undefined || va === null) va = '';
    if(vb === undefined || vb === null) vb = '';
    if(va < vb) return dir==='asc' ? -1 : 1;
    if(va > vb) return dir==='asc' ? 1 : -1;
    return 0;
  });
  return arr;
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clienteNome(id){ const c = DB.clientes.find(c=>c.id===id); return c ? c.nome : '—'; }
function clienteById(id){ return DB.clientes.find(c=>c.id===id); }
function produtoById(id){ return DB.produtos.find(p=>p.id===id); }
function itemExtraById(id){ return DB.itensExtras.find(e=>e.id===id); }
function filamentoRoloById(id){ return DB.filamentoEstoque.find(r=>r.id===id); }
function normalizarMarca(m){ return (m||'').trim().toLowerCase(); }
function filamentoTaraByMarca(marca){ return DB.filamentoTaras.find(t=> normalizarMarca(t.marca)===normalizarMarca(marca)); }
// Tara média (peso do carretel vazio) calculada a partir das amostras cadastradas para aquela MARCA
function filamentoTaraMediaMarca(marca){
  const t = filamentoTaraByMarca(marca);
  const amostras = (t && t.amostras) || [];
  if(!amostras.length) return 0;
  return amostras.reduce((s,v)=> s + Number(v||0), 0) / amostras.length;
}
// Peso líquido do filamento em um rolo: peso bruto (carretel + filamento) − tara média da marca
function filamentoPesoLiquido(rolo){
  const tara = filamentoTaraMediaMarca(rolo.marca);
  return Math.max(0, Number(rolo.pesoBruto||0) - tara);
}
// Lista de cores de um rolo (compatível com registros antigos que só tinham corHex único)
function filamentoCoresLista(rolo){
  if(rolo.cores && rolo.cores.length) return rolo.cores;
  return [{nome:'', hex: rolo.corHex || '#666'}];
}
function filamentoCoresChipsHTML(rolo){
  return filamentoCoresLista(rolo).map(c=>
    `<span class="color-chip"><span class="swatch" style="background:${c.hex||'#3fc1b0'};"></span>${c.nome? esc(c.nome) : ''}</span>`
  ).join(' ');
}

function estoqueQtd(produtoId){
  const st = DB.estoque.find(e => e.produtoId === produtoId);
  return st ? Number(st.quantidade)||0 : 0;
}

function setEstoqueQtd(produtoId, qtd){
  let st = DB.estoque.find(e => e.produtoId === produtoId);
  if(!st){
    st = { produtoId, quantidade: 0 };
    DB.estoque.push(st);

  st.quantidade = Math.max(0, Number(qtd)||0);
}

}

function maskPhoneBR(value){
  let d = String(value||'').replace(/\D/g,'').slice(0,11);
  if(d.length === 0) return '';
  if(d.length <= 2) return `(${d}`;
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7,11)}`;
}
function maskCEP(value){
  let d = String(value||'').replace(/\D/g,'').slice(0,8);
  if(d.length > 5) return `${d.slice(0,5)}-${d.slice(5)}`;
  return d;
}
function whatsappLink(telefone){

}

function resizeImageFile(file, maxSize=220){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxSize){ h=Math.round(h*maxSize/w); w=maxSize; } }
        else { if(h>maxSize){ w=Math.round(w*maxSize/h); h=maxSize; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>reject(new Error('imagem inválida'));
      img.src=ev.target.result;
    };
    reader.onerror=()=>reject(new Error('falha ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

function pedidoTotal(p){
  if(p.itens && p.itens.length){
    return p.itens.reduce((s,it)=> s + (Number(it.preco)*Number(it.qtd)) + itemAcrescimoTotal(it), 0);
  }
  return Number(p.valorManual)||0;
}
// Custo de um item do pedido: produto + itens extras marcados como "débito" (argolas, correntes, velas, etc.)
function itemCustoUnitario(it){
  const prod = produtoById(it.produtoId);
  const custoProd = prod ? Number(prod.custo||0) : 0;
  const custoExtras = (it.extras||[]).reduce((s,ex)=>{
    const item = itemExtraById(ex.itemExtraId);
    if(!item || (item.tipoValor||'debito')!=='debito') return s;
    return s + Number(item.custo||0)*Number(ex.qtd||1);
  },0);
  return custoProd + custoExtras;
}
// Soma dos itens extras marcados como "acréscimo" — some ao valor de venda do item
function itemAcrescimoTotal(it){
  return (it.extras||[]).reduce((s,ex)=>{
    const item = itemExtraById(ex.itemExtraId);
    if(!item || (item.tipoValor||'debito')!=='acrescimo') return s;
    return s + Number(item.custo||0)*Number(ex.qtd||1)*Number(it.qtd||1);
  },0);
}
function itemCustoTotal(it){
  return itemCustoUnitario(it) * Number(it.qtd||1);
}
// Custo total do pedido = soma do custo de cada item (produto + acessórios) já vendido
function pedidoCustoItens(p){
  return (p.itens||[]).reduce((s,it)=> s + itemCustoTotal(it), 0);
}
// Taxa cobrada pela operadora de cartão, debitada do lucro
function pedidoTaxaCartao(p){
  if(!['Cartão de Crédito','Cartão de Débito'].includes(p.formaPagamento)) return 0;
  const perc = Number(p.taxaCartaoPercent)||0;
  return pedidoTotal(p) * (perc/100);
}
// Valor Bruto: soma pura do valor de venda (faturamento), sem descontar nada
function pedidoValorBruto(p){
  return pedidoTotal(p);
}
// Lucro líquido: valor da venda − custo dos itens (produto+extras) − taxa de cartão − outras despesas extras
function pedidoLucroLiquido(p){
  return pedidoTotal(p) - pedidoCustoItens(p) - pedidoTaxaCartao(p) - (Number(p.custoExtra)||0);
}

  return `${nomes[Number(m)-1]}/${y}`;
}

function openClienteForm(id){
  const editing = id ? DB.clientes.find(c=>c.id===id) : null;
  let fotoData = editing?.foto || '';

  openModal(`
    <div class="modal-head"><h3>${editing?'Editar cliente':'Novo cliente'}</h3>
      <button class="modal-close" id="mClose">${ICON_CLOSE}</button></div>
    <form id="formCliente">
      <div class="avatar-upload">
        <div id="avatarPreview">${avatarHTML(editing||{}, 56)}</div>
        <div class="avatar-actions">
          <button type="button" class="btn ghost sm" id="btnFoto">Escolher foto</button>
          <button type="button" class="btn ghost sm" id="btnRemoverFoto" style="${fotoData?'':'display:none'}">Remover foto</button>
          <input type="file" id="fotoInput" accept="image/*" hidden>
        </div>
      </div>

      <div class="field"><label>Nome *</label><input name="nome" required value="${esc(editing?.nome||'')}"></div>

      <div class="field-row">
        <div class="field">
          <label>Telefone / WhatsApp</label>
          <div class="phone-group">
            <span class="phone-prefix">+55</span>
            <input name="telefone" id="telefoneInput" placeholder="(00) 00000-0000" value="${esc(maskPhoneBR(editing?.telefone||''))}">
            <button type="button" class="icon-btn whatsapp-btn" id="btnWhats" title="Abrir no WhatsApp">${ICON_WHATS}</button>
          </div>
        </div>
        <div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(editing?.email||'')}"></div>
      </div>

      <div class="field">
        <label>CEP</label>
        <div class="cep-group">
          <input name="cep" id="cepInput" placeholder="00000-000" value="${esc(maskCEP(editing?.cep||''))}">
          <button type="button" class="btn secondary sm" id="btnCep" style="flex-shrink:0">Buscar endereço</button>
        </div>
        <p class="hint" id="cepStatus">Digite o CEP para preencher o endereço automaticamente.</p>
      </div>

      <div class="field-row">
        <div class="field"><label>Logradouro</label><input name="logradouro" id="logradouroInput" value="${esc(editing?.logradouro||'')}"></div>
        <div class="field"><label>Bairro</label><input name="bairro" id="bairroInput" value="${esc(editing?.bairro||'')}"></div>
      </div>
      <div class="field-row three">
        <div class="field"><label>Número</label><input name="numero" value="${esc(editing?.numero||'')}"></div>
        <div class="field"><label>Complemento</label><input name="complemento" value="${esc(editing?.complemento||'')}"></div>
        <div class="field"><label>Cidade</label><input name="cidade" id="cidadeInput" value="${esc(editing?.cidade||'')}"></div>
      </div>
      <div class="field" style="max-width:110px"><label>UF</label><input name="uf" id="ufInput" maxlength="2" style="text-transform:uppercase" value="${esc(editing?.uf||'')}"></div>

      <div class="field"><label>Observações</label><textarea name="obs">${esc(editing?.obs||'')}</textarea></div>

      <div class="modal-actions">
        <button type="button" class="btn secondary" id="mCancel">Cancelar</button>
        <button type="submit" class="btn">${editing?'Salvar alterações':'Cadastrar cliente'}</button>
      </div>
    </form>
  `);

  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);

  document.getElementById('telefoneInput').addEventListener('input', e=>{
    e.target.value = maskPhoneBR(e.target.value);
  });
  document.getElementById('btnWhats').addEventListener('click', ()=>{
    const link = whatsappLink(document.getElementById('telefoneInput').value);
    if(!link){ alert('Informe o telefone primeiro.'); return; }
    window.open(link, '_blank');
  });
  document.getElementById('cepInput').addEventListener('input', e=>{
    e.target.value = maskCEP(e.target.value);
  });
  async function buscarCEP(){
    const digits = document.getElementById('cepInput').value.replace(/\D/g,'');
    const statusEl = document.getElementById('cepStatus');
    if(digits.length!==8){ statusEl.textContent='CEP deve ter 8 dígitos.'; statusEl.style.color='var(--danger)'; return; }
    statusEl.textContent='Buscando endereço…'; statusEl.style.color='var(--text-muted)';
    try{
      const res = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
      const data = await res.json();
      if(data.erro){ statusEl.textContent='CEP não encontrado.'; statusEl.style.color='var(--danger)'; return; }
      document.getElementById('logradouroInput').value = data.logradouro || '';
      document.getElementById('bairroInput').value = data.bairro || '';
      document.getElementById('cidadeInput').value = data.localidade || '';
      document.getElementById('ufInput').value = data.uf || '';
      statusEl.textContent = 'Endereço preenchido — confira o número e complemento.';
      statusEl.style.color='var(--success)';
    }catch(err){
      statusEl.textContent='Não foi possível buscar o CEP (verifique sua internet).';
      statusEl.style.color='var(--danger)';
    }
  }
  document.getElementById('btnCep').addEventListener('click', buscarCEP);
  document.getElementById('cepInput').addEventListener('blur', ()=>{
    if(document.getElementById('cepInput').value.replace(/\D/g,'').length===8) buscarCEP();
  });
  document.getElementById('btnFoto').addEventListener('click', ()=> document.getElementById('fotoInput').click());
  document.getElementById('fotoInput').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      fotoData = await resizeImageFile(file);
      document.getElementById('avatarPreview').innerHTML = `<img class="avatar-img" style="width:56px;height:56px" src="${fotoData}">`;
      document.getElementById('btnRemoverFoto').style.display='inline-flex';
    }catch(err){ alert('Não foi possível carregar essa imagem.'); }
  });
  document.getElementById('btnRemoverFoto').addEventListener('click', ()=>{
    fotoData = '';
    const nomeAtual = document.querySelector('#formCliente [name=nome]').value;
    document.getElementById('avatarPreview').innerHTML = avatarHTML({nome:nomeAtual}, 56);
    document.getElementById('btnRemoverFoto').style.display='none';
  });

  document.getElementById('formCliente').addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const obj = {
      nome:f.get('nome').trim(),
      telefone:f.get('telefone').trim(),
      email:f.get('email').trim(),
      cep:f.get('cep').trim(),
      logradouro:f.get('logradouro').trim(),
      numero:f.get('numero').trim(),
      complemento:f.get('complemento').trim(),
      bairro:f.get('bairro').trim(),
      cidade:f.get('cidade').trim(),
      uf:(f.get('uf')||'').trim().toUpperCase(),
      obs:f.get('obs').trim(),
      foto:fotoData
    };
    if(editing){ Object.assign(editing, obj); }
    else { obj.id = uid(); DB.clientes.push(obj); }
    save(); closeModal(); renderClientes();
  });
}

let produtoFiltro = '';
let produtoOrdem = 'nome-asc';
function gerarCatalogoPDF(){
  if(!DB.produtos.length){ alert('Cadastre ao menos um produto antes de gerar o catálogo.'); return; }
  if(typeof window.jspdf === 'undefined'){
    alert('Não foi possível carregar o gerador de PDF. Verifique sua conexão com a internet e tente novamente.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 12;
  const nomeApp = DB.config.appNome || 'Vini Makers';
  const subtitulo = DB.config.appSubtitulo || 'Gestão 3D';
  const accent = [63,193,176];
  const dark = [22,23,26];
  const cardBg = [30,31,35];
  const cardBorder = [50,51,56];
  const gray = [150,150,155];

  function drawHeader(){
    doc.setFillColor(...dark);
    doc.rect(0,0,pageW,28,'F');
    doc.setFillColor(...accent);
    doc.rect(0,28,pageW,1,'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(18);
    doc.setTextColor(255,255,255);
    doc.text(nomeApp, margin, 15);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    doc.setTextColor(...gray);
    doc.text(`${subtitulo} — Catálogo de Produtos`, margin, 21.5);
    doc.setFontSize(8.5);
    doc.text(`Gerado em ${fmtDate(todayISO())}`, pageW-margin, 21.5, {align:'right'});
  }

  const cols = 3;
  const gap = 6;
  const cardW = (pageW - margin*2 - gap*(cols-1)) / cols;
  const photoSize = cardW - 10;
  const cardH = photoSize + 28;
  const startY = 36;
  const bottomLimit = pageH - margin;

  let x = margin, y = startY, col = 0;
  drawHeader();

  DB.produtos.forEach(p=>{
    if(y + cardH > bottomLimit){
      doc.addPage();
      drawHeader();
      x = margin; y = startY; col = 0;
    }

    doc.setFillColor(...cardBg);
    doc.roundedRect(x, y, cardW, cardH, 3, 3, 'F');
    doc.setDrawColor(...cardBorder);
    doc.roundedRect(x, y, cardW, cardH, 3, 3, 'S');

    const photoX = x + (cardW-photoSize)/2;
    const photoY = y + 5;
    let imgOk = false;
    if(p.foto){
      try{ doc.addImage(p.foto, 'JPEG', photoX, photoY, photoSize, photoSize); imgOk = true; }
      catch(e){ imgOk = false; }
    }
    if(!imgOk){
      doc.setFillColor(40,41,46);
      doc.roundedRect(photoX, photoY, photoSize, photoSize, 2, 2, 'F');
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(...gray);
      doc.text('sem foto', x+cardW/2, photoY+photoSize/2, {align:'center'});
    }

    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.setTextColor(255,255,255);
    const nameLines = doc.splitTextToSize(p.nome||'', cardW-8).slice(0,2);
    doc.text(nameLines, x+4, photoY+photoSize+7);

    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(...gray);
    doc.text(p.categoria || '—', x+4, photoY+photoSize+7 + (nameLines.length>1?9:5.5));

    doc.setFont('helvetica','bold');
    doc.setFontSize(11.5);
    doc.setTextColor(...accent);
    doc.text(fmtMoney(p.preco), x+cardW-4, y+cardH-4.5, {align:'right'});

    col++;
    if(col>=cols){ col=0; x=margin; y+=cardH+gap; }
    else { x += cardW+gap; }
  });

  const totalPages = doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(...gray);
    doc.text(`Página ${i} de ${totalPages}`, pageW/2, pageH-6, {align:'center'});
  }

  doc.save(`catalogo-produtos-${todayISO()}.pdf`);
}

  document.getElementById('btnNovoProduto').addEventListener('click', ()=> openProdutoForm());
  document.getElementById('btnNovoProdutoEmpty')?.addEventListener('click', ()=> openProdutoForm());

}

  document.getElementById('btnFotoExtra').addEventListener('click', ()=> document.getElementById('fotoInputExtra').click());
  document.getElementById('fotoInputExtra').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    try{

      document.getElementById('extraPreview').innerHTML = produtoThumbHTML({foto:fotoData}, 56);

  document.getElementById('btnRemoverFotoExtra').addEventListener('click', ()=>{

    document.getElementById('extraPreview').innerHTML = produtoThumbHTML({}, 56);
    document.getElementById('btnRemoverFotoExtra').style.display='none';
  });
  document.getElementById('formItemExtra').addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const obj = { nome: f.get('nome').trim(), custo: parseFloat(f.get('custo'))||0, foto: fotoData, tipoValor: f.get('tipoValor')||'debito' };

    save(); closeModal(); renderItensAdicionais();
  });
}

// Gerenciar (criar, editar, excluir) categorias e materiais usados nos produtos
function openGerenciarCatMat(){
  function draw(){
    openModal(`
      <div class="modal-head"><h3>Categorias e Materiais</h3>
        <button class="modal-close" id="mClose">${ICON_CLOSE}</button></div>

      <label style="display:block; font-weight:600; font-size:13.5px; margin-bottom:8px;">Categorias</label>
      <div class="field-row">
        <div class="field" style="flex:1;"><input type="text" id="inputNovaCategoria" placeholder="Nova categoria"></div>
        <div style="display:flex; align-items:flex-start;"><button type="button" class="btn secondary" id="btnAddCategoria">${ICON_PLUS}Adicionar</button></div>
      </div>
      ${DB.categorias.length ? DB.categorias.map((c,i)=>`
        <div class="extra-item-row">
          <input type="text" class="mono" data-editar-categoria="${i}" value="${esc(c)}" style="background:transparent; border:1px solid var(--border); border-radius:6px; padding:6px 8px; color:var(--text);">
          <span></span>
          <button type="button" class="icon-btn" data-del-categoria="${i}">${ICON_TRASH}</button>
        </div>
      `).join('') : '<p class="hint">Nenhuma categoria cadastrada.</p>'}

      <hr style="border:none; border-top:1px solid var(--border); margin:18px 0;">

      <label style="display:block; font-weight:600; font-size:13.5px; margin-bottom:8px;">Materiais</label>
      <div class="field-row">
        <div class="field" style="flex:1;"><input type="text" id="inputNovoMaterial" placeholder="Novo material"></div>
        <div style="display:flex; align-items:flex-start;"><button type="button" class="btn secondary" id="btnAddMaterial">${ICON_PLUS}Adicionar</button></div>
      </div>
      ${DB.materiais.length ? DB.materiais.map((m,i)=>`
        <div class="extra-item-row">
          <input type="text" class="mono" data-editar-material="${i}" value="${esc(m)}" style="background:transparent; border:1px solid var(--border); border-radius:6px; padding:6px 8px; color:var(--text);">
          <span></span>
          <button type="button" class="icon-btn" data-del-material="${i}">${ICON_TRASH}</button>
        </div>
      `).join('') : '<p class="hint">Nenhum material cadastrado.</p>'}

      <div class="modal-actions">
        <button type="button" class="btn" id="btnConcluirCatMat">Concluir</button>
      </div>
    `, true);

    document.getElementById('mClose').addEventListener('click', ()=>{ closeModal(); renderProdutos(); });
    document.getElementById('btnConcluirCatMat').addEventListener('click', ()=>{ closeModal(); renderProdutos(); });

    document.getElementById('btnAddCategoria').addEventListener('click', ()=>{
      const val = document.getElementById('inputNovaCategoria').value.trim();
      if(!val){ alert('Digite o nome da categoria.'); return; }
      if(DB.categorias.includes(val)){ alert('Essa categoria já existe.'); return; }
      DB.categorias.push(val);
      save(); draw();
    });
    document.getElementById('btnAddMaterial').addEventListener('click', ()=>{
      const val = document.getElementById('inputNovoMaterial').value.trim();
      if(!val){ alert('Digite o nome do material.'); return; }
      if(DB.materiais.includes(val)){ alert('Esse material já existe.'); return; }
      DB.materiais.push(val);
      save(); draw();
    });

    document.querySelectorAll('[data-editar-categoria]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const i = Number(inp.dataset.editarCategoria);
        const antigo = DB.categorias[i];
        const novo = inp.value.trim();
        if(!novo){ inp.value = antigo; return; }
        DB.categorias[i] = novo;
        DB.produtos.forEach(p=>{ if(p.categoria===antigo) p.categoria = novo; });
        save(); draw();
      });
    });
    document.querySelectorAll('[data-editar-material]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const i = Number(inp.dataset.editarMaterial);
        const antigo = DB.materiais[i];
        const novo = inp.value.trim();
        if(!novo){ inp.value = antigo; return; }
        DB.materiais[i] = novo;
        DB.produtos.forEach(p=>{ if(p.material===antigo) p.material = novo; });
        save(); draw();
      });
    });
    document.querySelectorAll('[data-del-categoria]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const i = Number(b.dataset.delCategoria);
        const nome = DB.categorias[i];
        const emUso = DB.produtos.filter(p=>p.categoria===nome).length;
        if(emUso && !confirm(`${emUso} produto(s) usam essa categoria. Excluir mesmo assim?`)) return;
        DB.categorias.splice(i,1);
        save(); draw();
      });
    });
    document.querySelectorAll('[data-del-material]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const i = Number(b.dataset.delMaterial);
        const nome = DB.materiais[i];
        const emUso = DB.produtos.filter(p=>p.material===nome).length;
        if(emUso && !confirm(`${emUso} produto(s) usam esse material. Excluir mesmo assim?`)) return;
        DB.materiais.splice(i,1);
        save(); draw();
      });
    });
  }
  draw();
}

function openProdutoForm(id, baseId){
  const editing = id ? DB.produtos.find(p=>p.id===id) : null;
  const base = (!editing && baseId) ? DB.produtos.find(p=>p.id===baseId) : null;
  const origem = editing || base; // dados usados para preencher o formulário
  let cores = origem?.cores ? JSON.parse(JSON.stringify(origem.cores)) : [];
  let fotoData = origem?.foto || '';

  function renderCoresList(){
    const area = document.getElementById('coresArea');
    if(!area) return;
    area.innerHTML = cores.map((c, idx) => `
      <div class="color-row">
        <input type="color" class="color-hex" data-idx="${idx}" value="${c.hex||'#3fc1b0'}" style="width:40px; height:34px; padding:2px; cursor:pointer;">
        <input type="text" class="color-nome" data-idx="${idx}" value="${esc(c.nome)}" placeholder="Nome da cor (ex: Azul, Dourado)">
        <button type="button" class="icon-btn remove-color" data-idx="${idx}">${ICON_CLOSE}</button>
      </div>
    `).join('');

    area.querySelectorAll('.color-hex').forEach(inp => {
      inp.addEventListener('input', e => { cores[e.target.dataset.idx].hex = e.target.value; });
    });
    area.querySelectorAll('.color-nome').forEach(inp => {
      inp.addEventListener('input', e => {
        const idx = e.target.dataset.idx;
        cores[idx].nome = e.target.value;
        const hexAuto = corPorNome(e.target.value);
        if(hexAuto){
          cores[idx].hex = hexAuto;
          const hexInput = area.querySelector(`.color-hex[data-idx="${idx}"]`);
          if(hexInput) hexInput.value = hexAuto;
        }
      });
    });
    area.querySelectorAll('.remove-color').forEach(btn => {
      btn.addEventListener('click', e => {
        const idx = Number(e.currentTarget.dataset.idx);
        cores.splice(idx, 1);
        renderCoresList();
      });
    });
  }

  openModal(`
    <div class="modal-head"><h3>${editing?'Editar produto':'Novo produto'}</h3>
      <button class="modal-close" id="mClose">${ICON_CLOSE}</button></div>
    <form id="formProduto">
      ${!editing && DB.produtos.length ? `
      <div class="field">
        <label>Usar outro produto como modelo (opcional)</label>
        <select id="selectModelo">
          <option value="">Começar em branco</option>
          ${DB.produtos.map(p=>`<option value="${p.id}" ${baseId===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}
        </select>
      </div>` : ''}
      <div class="avatar-upload">
        <div id="prodPreview">${produtoThumbHTML({foto:fotoData}, 56)}</div>
        <div class="avatar-actions">
          <button type="button" class="btn ghost sm" id="btnFotoProd">Foto da peça</button>
          <button type="button" class="btn ghost sm" id="btnRemoverFotoProd" style="${fotoData?'':'display:none'}">Remover foto</button>
          <input type="file" id="fotoInputProd" accept="image/*" hidden>
        </div>
      </div>

      <div class="field"><label>Nome do produto *</label><input name="nome" required value="${esc(editing ? (origem?.nome||'') : (base? base.nome+' (cópia)':''))}"></div>
      <div class="field-row">
        <div class="field"><label>Categoria</label>
          <div style="display:flex; gap:6px;">
            <select name="categoria" id="selectCategoria" style="flex:1;">
              <option value="">Selecione…</option>
              ${DB.categorias.map(c=>`<option value="${esc(c)}" ${origem?.categoria===c?'selected':''}>${esc(c)}</option>`).join('')}
            </select>
            <button type="button" class="btn ghost sm" id="btnNovaCategoria">${ICON_PLUS}</button>
          </div>
        </div>
        <div class="field"><label>Material</label>
          <div style="display:flex; gap:6px;">
            <select name="material" id="selectMaterial" style="flex:1;">
              <option value="">Selecione…</option>
              ${DB.materiais.map(m=>`<option value="${esc(m)}" ${origem?.material===m?'selected':''}>${esc(m)}</option>`).join('')}
            </select>
            <button type="button" class="btn ghost sm" id="btnNovoMaterial">${ICON_PLUS}</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Cores da Peça</label>
        <div id="coresArea"></div>
        <button type="button" class="btn ghost sm" id="btnAddColor" style="margin-top:6px;">${ICON_PLUS}Adicionar cor</button>
        <p class="hint">Adicione quantas cores forem necessárias para este produto.</p>
      </div>

      <div class="field-row">
        <div class="field"><label>Peso (g)</label><input name="peso" type="number" step="1" min="0" value="${origem?.peso??''}"></div>
        <div class="field"><label>Custo (R$)</label><input name="custo" type="number" step="0.01" min="0" value="${origem?.custo??''}"></div>
      </div>
      
      <div class="field"><label>Preço de venda (R$) *</label><input name="preco" type="number" step="0.01" min="0" required value="${origem?.preco??''}"></div>

      <div class="modal-actions">
        <button type="button" class="btn secondary" id="mCancel">Cancelar</button>
        ${editing? `<button type="button" class="btn secondary" id="btnSalvarComo">Salvar como novo</button>` : ''}
        <button type="submit" class="btn">${editing?'Salvar alterações':'Cadastrar produto'}</button>
      </div>
    </form>
  `, true);

  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('selectModelo')?.addEventListener('change', e=>{
    openProdutoForm(null, e.target.value || null);
  });

  renderCoresList();

  document.getElementById('btnAddColor').addEventListener('click', ()=>{
    cores.push({nome:'', hex:'#3fc1b0'});
    renderCoresList();
  });

  document.getElementById('btnFotoProd').addEventListener('click', ()=> document.getElementById('fotoInputProd').click());
  document.getElementById('btnNovaCategoria').addEventListener('click', ()=>{
    const nova = prompt('Nome da nova categoria:');
    if(!nova || !nova.trim()) return;
    if(!DB.categorias.includes(nova.trim())) DB.categorias.push(nova.trim());
    save();
    const sel = document.getElementById('selectCategoria');
    sel.innerHTML = `<option value="">Selecione…</option>${DB.categorias.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}`;
    sel.value = nova.trim();
  });
  document.getElementById('btnNovoMaterial').addEventListener('click', ()=>{
    const novo = prompt('Nome do novo material:');
    if(!novo || !novo.trim()) return;
    if(!DB.materiais.includes(novo.trim())) DB.materiais.push(novo.trim());
    save();
    const sel = document.getElementById('selectMaterial');
    sel.innerHTML = `<option value="">Selecione…</option>${DB.materiais.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}`;
    sel.value = novo.trim();
  });
  document.getElementById('fotoInputProd').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      fotoData = await resizeImageFile(file, 250);
      document.getElementById('prodPreview').innerHTML = produtoThumbHTML({foto:fotoData}, 56);
      document.getElementById('btnRemoverFotoProd').style.display='inline-flex';
    }catch(err){ alert('Não foi possível carregar essa imagem.'); }
  });
  document.getElementById('btnRemoverFotoProd').addEventListener('click', ()=>{
    fotoData = '';
    document.getElementById('prodPreview').innerHTML = produtoThumbHTML({}, 56);
    document.getElementById('btnRemoverFotoProd').style.display='none';
  });

  function coletarObjProduto(f){
    return {
      nome:f.get('nome').trim(), categoria:f.get('categoria').trim(), material:f.get('material').trim(),
      cores: cores.filter(c => c.nome.trim() !== ''),
      peso:f.get('peso'),
      custo:parseFloat(f.get('custo'))||0, preco:parseFloat(f.get('preco'))||0,
      foto: fotoData
    };
  }
  document.getElementById('btnSalvarComo')?.addEventListener('click', ()=>{
    const f = new FormData(document.getElementById('formProduto'));
    if(!f.get('nome').trim()){ alert('Preencha o nome do produto.'); return; }
    const obj = coletarObjProduto(f);
    obj.id = uid();
    DB.produtos.push(obj);
    setEstoqueQtd(obj.id, 0);
    save(); closeModal(); renderProdutos();
  });
  document.getElementById('formProduto').addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const obj = coletarObjProduto(f);

    if(editing){ 
      Object.assign(editing, obj); 
    } else { 
      obj.id = uid(); 
      DB.produtos.push(obj); 
      setEstoqueQtd(obj.id, 0);
    }
    save(); closeModal(); renderProdutos();
  });
}

/* =========================================================
   ESTOQUE (SOMENTE PRODUTOS CADASTRADOS)
   ========================================================= */
// tipo: 'produto' ou 'extra'
function openEstoqueModal(tipo, id){
  const item = tipo === 'produto' ? produtoById(id) : itemExtraById(id);
  if(!item) return;
  const getQtd = () => tipo === 'produto' ? estoqueQtd(id) : estoqueExtraQtd(id);
  const setQtd = (v) => tipo === 'produto' ? setEstoqueQtd(id, v) : setEstoqueExtraQtd(id, v);

  let currentTab = 'acrescimo';

  openModal(`
    <div class="modal-head">
      <h3>Ajustar Estoque: ${esc(item.nome)}</h3>
      <button class="modal-close" id="mClose">${ICON_CLOSE}</button>
    </div>
    
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:16px; background:var(--surface-2); padding:12px; border-radius:8px;">
      ${produtoThumbHTML(item, 48)}
      <div>
        <div style="font-size:12px; color:var(--text-muted);">Estoque atual:</div>
        <div style="font-size:22px; font-family:var(--font-mono); font-weight:600; color:var(--accent);" id="visuQtdAtual">${getQtd()} un.</div>
      </div>
    </div>

    <div class="stock-tabs">
      <button type="button" class="stock-tab active" data-tab="acrescimo">+ Acréscimo</button>
      <button type="button" class="stock-tab" data-tab="debito">- Débito</button>
      <button type="button" class="stock-tab" data-tab="direto">✏️ Modificar Direto</button>
    </div>

    <form id="formAjusteEstoque">
      <div id="tabContent"></div>

      <div class="modal-actions">
        <button type="button" class="btn secondary" id="mCancel">Cancelar</button>
        <button type="submit" class="btn">Aplicar Alteração</button>
      </div>
    </form>
  `);

  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);

  function renderTabContent(){
    const container = document.getElementById('tabContent');
    const qAtual = getQtd();

    if(currentTab === 'acrescimo'){
      container.innerHTML = `
        <div class="field">
          <label>Quantidade a Adicionar</label>
          <input type="number" id="inputVal" min="1" step="1" value="1" required>
          <p class="hint">Adiciona unidades ao saldo atual de estoque.</p>
        </div>
      `;
    } else if(currentTab === 'debito'){
      container.innerHTML = `
        <div class="field">
          <label>Quantidade a Retirar (Débito)</label>
          <input type="number" id="inputVal" min="1" max="${qAtual}" step="1" value="1" required>
          <p class="hint">Subtrai unidades do saldo atual de estoque.</p>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="field">
          <label>Novo Valor do Visor (Digite o total exato)</label>
          <input type="number" id="inputVal" min="0" step="1" value="${qAtual}" required>
          <p class="hint">Substitui diretamente o valor do visor do estoque por este número.</p>
        </div>
      `;
    }
  }

  document.querySelectorAll('.stock-tab').forEach(t => {
    t.addEventListener('click', e => {
      document.querySelectorAll('.stock-tab').forEach(st => st.classList.remove('active'));
      e.target.classList.add('active');
      currentTab = e.target.dataset.tab;
      renderTabContent();
    });
  });

  renderTabContent();

  document.getElementById('formAjusteEstoque').addEventListener('submit', e => {
    e.preventDefault();
    const val = parseInt(document.getElementById('inputVal').value, 10)||0;
    const qAtual = getQtd();

    if(currentTab === 'acrescimo'){
      setQtd(qAtual + val);
    } else if(currentTab === 'debito'){
      setQtd(Math.max(0, qAtual - val));
    } else {
      setQtd(val);
    }

    save();
    closeModal();
    if(tipo === 'produto') renderProdutos();
    else renderItensAdicionais();
  });
}

   ITENS ADICIONAIS (ACESSÓRIOS: CATÁLOGO + ESTOQUE)

let itensAdicionaisOrdem = 'nome-asc';

  const [campoOrd, dirOrd] = itensAdicionaisOrdem.split('-');
  const listaOrdenada = campoOrd==='estoque'
    ? ordenarLista(DB.itensExtras.map(ex=>({...ex, __estoque:estoqueExtraQtd(ex.id)})), '__estoque', dirOrd)
    : ordenarLista(DB.itensExtras, campoOrd, dirOrd);
  pageEl.innerHTML = `
    <div class="page-head">
      <div><h1>Itens Adicionais</h1><p>Acessórios (argolas, correntes, velas de LED...) que podem ser somados ao custo dos pedidos.</p></div>

    </div>

    <div class="panel" style="padding:14px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;">

    </div>

    <div class="panel">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <h2 style="margin:0;">Itens Adicionais <span class="count">${DB.itensExtras.length} item(ns)</span></h2>

          <option value="nome-asc" ${itensAdicionaisOrdem==='nome-asc'?'selected':''}>Nome (A-Z)</option>
          <option value="nome-desc" ${itensAdicionaisOrdem==='nome-desc'?'selected':''}>Nome (Z-A)</option>
          <option value="custo-asc" ${itensAdicionaisOrdem==='custo-asc'?'selected':''}>Custo (menor-maior)</option>
          <option value="custo-desc" ${itensAdicionaisOrdem==='custo-desc'?'selected':''}>Custo (maior-menor)</option>
          <option value="estoque-asc" ${itensAdicionaisOrdem==='estoque-asc'?'selected':''}>Estoque (menor-maior)</option>
          <option value="estoque-desc" ${itensAdicionaisOrdem==='estoque-desc'?'selected':''}>Estoque (maior-menor)</option>
        </select>
      </div>
      ${listaOrdenada.length ? `<div class="table-wrap"><table>
        <thead><tr><th></th><th>Item</th><th class="num">Custo un.</th><th class="num">Qtd. em Estoque</th><th></th></tr></thead>
        <tbody>
          ${listaOrdenada.map(ex=>{
            const qtd = estoqueExtraQtd(ex.id);
            const baixo = qtd <= limiteItens;
            return `<tr data-dbl="${ex.id}">
              <td style="width:40px;">${produtoThumbHTML(ex, 36)}</td>
              <td><b>${esc(ex.nome)}</b></td>
              <td class="num mono">${fmtMoney(ex.custo)}</td>
              <td class="num mono" style="font-size:16px; font-weight:600; ${baixo?'color:var(--danger);':''}">${qtd} un.</td>
              <td><div class="row-actions">
                <button class="btn sm secondary" data-mod-extra="${ex.id}">Estoque</button>
                <button class="icon-btn" data-edit-extra="${ex.id}">${ICON_EDIT}</button>
                <button class="icon-btn" data-del-extra="${ex.id}">${ICON_TRASH}</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>` : emptyState('Nenhum item extra cadastrado.', 'btnNovoItemExtraEmpty')}
    </div>
  `;
  document.getElementById('selectOrdemItens').addEventListener('change', e=>{
    itensAdicionaisOrdem = e.target.value; renderItensAdicionais();
  });
  document.getElementById('btnNovoItemExtra')?.addEventListener('click', ()=> openItemExtraForm());
  document.getElementById('btnNovoItemExtraEmpty')?.addEventListener('click', ()=> openItemExtraForm());
  document.getElementById('btnSalvarLimiteItens').addEventListener('click', ()=>{
    const val = parseInt(document.getElementById('inputLimiteItens').value, 10);
    DB.config.limiteBaixoItensAdicionais = isNaN(val) ? 5 : Math.max(0, val);
    save(); renderItensAdicionais();
  });
  pageEl.querySelectorAll('[data-edit-extra]').forEach(b=> b.addEventListener('click', ()=> openItemExtraForm(b.dataset.editExtra)));
  pageEl.querySelectorAll('tr[data-dbl]').forEach(tr=> tr.addEventListener('dblclick', e=>{
    if(e.target.closest('.row-actions')) return;
    openItemExtraForm(tr.dataset.dbl);
  }));
  pageEl.querySelectorAll('[data-del-extra]').forEach(b=> b.addEventListener('click', ()=>{
    if(!confirm('Excluir este item extra?')) return;
    DB.itensExtras = DB.itensExtras.filter(e=>e.id!==b.dataset.delExtra);
    DB.estoqueExtras = DB.estoqueExtras.filter(e=>e.itemExtraId!==b.dataset.delExtra);
    save(); renderItensAdicionais();
  }));
  pageEl.querySelectorAll('[data-mod-extra]').forEach(b=> b.addEventListener('click', ()=> openEstoqueModal('extra', b.dataset.modExtra)));
}

/* =========================================================
